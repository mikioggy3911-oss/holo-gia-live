<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in - F12 ORBIT</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
body { background: #000; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; overflow: hidden; }

.bg-animation { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
.bg-animation::before, .bg-animation::after { content: ''; position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.35; }
.bg-animation::before { width: 400px; height: 400px; background: #ff0000; top: -200px; right: -100px; animation: float 8s ease-in-out infinite; }
.bg-animation::after { width: 350px; height: 350px; background: #4285f4; bottom: -150px; left: -100px; animation: float 10s ease-in-out infinite reverse; }
@keyframes float { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(40px, 40px) scale(1.1); } }

.login-container {
    max-width: 400px; width: 100%;
    background: rgba(20, 20, 20, 0.7);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 20px;
    padding: 36px 28px;
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    position: relative;
    z-index: 1;
}

.logo-section { text-align: center; margin-bottom: 28px; }

/* ============ F12 LOGO WITH ANIMATION ============ */
.f12-logo-wrapper {
    display: inline-block;
    padding: 3px;
    border-radius: 24px;
    background: linear-gradient(90deg, #ffffff 0%, #d0d0d0 40%, #a0a0a0 49%, #ff3333 51%, #cc0000 70%, #880000 100%);
    box-shadow: 0 0 40px rgba(255,0,0,0.4), 0 0 20px rgba(255,255,255,0.1);
    margin-bottom: 18px;
    animation: logoFloat 3s ease-in-out infinite, logoGlow 2s ease-in-out infinite;
    position: relative;
}

@keyframes logoFloat {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-8px) rotate(2deg); }
}

@keyframes logoGlow {
    0%, 100% { box-shadow: 0 0 40px rgba(255,0,0,0.4), 0 0 20px rgba(255,255,255,0.1); }
    50% { box-shadow: 0 0 60px rgba(255,0,0,0.7), 0 0 30px rgba(255,255,255,0.2); }
}

.f12-logo-wrapper::before {
    content: '';
    position: absolute;
    inset: -8px;
    border-radius: 30px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    opacity: 0;
    animation: shimmerLogo 3s linear infinite;
}

@keyframes shimmerLogo {
    0% { opacity: 0; transform: translateX(-100%); }
    50% { opacity: 1; }
    100% { opacity: 0; transform: translateX(100%); }
}

.f12-logo-inner {
    display: inline-flex;
    align-items: center;
    padding: 14px 28px;
    background: #000;
    border-radius: 22px;
    position: relative;
    overflow: hidden;
}

.f12-logo-inner::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 50%;
    background: linear-gradient(180deg, rgba(255,255,255,0.15), transparent);
    pointer-events: none;
}

.f12-text {
    font-family: 'Orbitron', sans-serif;
    font-size: 36px;
    font-weight: 900;
    letter-spacing: -2px;
    font-style: italic;
    line-height: 1;
    display: flex;
    position: relative;
    z-index: 2;
}

.f12-text .f {
    background: linear-gradient(180deg, #ffffff 0%, #e8e8e8 50%, #a8a8a8 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.8));
    margin-right: 2px;
    animation: textPulse 2s ease-in-out infinite;
}

.f12-text .num {
    background: linear-gradient(180deg, #ff4444 0%, #cc0000 50%, #880000 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.8));
    animation: textPulse 2s ease-in-out infinite 1s;
}

@keyframes textPulse {
    0%, 100% { filter: drop-shadow(0 2px 3px rgba(0,0,0,0.8)); }
    50% { filter: drop-shadow(0 2px 8px rgba(255,255,255,0.4)); }
}
/* ============ END LOGO ============ */

.logo-title {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: -1px;
    margin-bottom: 4px;
    animation: titleFade 1s ease-out;
}

@keyframes titleFade {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

.logo-title span { color: #ff0000; }

.logo-subtitle {
    color: rgba(255,255,255,0.5);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 1px;
    text-transform: uppercase;
}

.form-section h2 { font-size: 20px; font-weight: 700; margin-bottom: 6px; text-align: center; }
.form-section p { color: rgba(255,255,255,0.5); font-size: 13px; text-align: center; margin-bottom: 24px; }

/* Google Button - Compact & Beautiful */
#google-signin-btn { display: flex; justify-content: center; margin-bottom: 12px; min-height: 0; }
#google-signin-btn iframe { transform: scale(0.95); }

.google-fallback {
    background: white;
    color: #1f1f1f;
    border: none;
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: all 0.2s;
    margin-bottom: 12px;
    box-shadow: 0 4px 12px rgba(255,255,255,0.1);
}

.google-fallback:hover {
    background: #f5f5f5;
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(255,255,255,0.15);
}

.google-fallback:active { transform: translateY(0); }

.google-fallback svg { width: 18px; height: 18px; }

.divider {
    display: flex;
    align-items: center;
    margin: 18px 0;
    color: rgba(255,255,255,0.3);
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 1px;
}
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.08); }
.divider span { padding: 0 12px; }

.form-group { margin-bottom: 12px; }
.form-group input {
    width: 100%;
    padding: 14px 16px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    color: #fff;
    font-size: 14px;
    font-weight: 500;
    outline: none;
    transition: all 0.2s;
}
.form-group input::placeholder { color: rgba(255,255,255,0.3); }
.form-group input:focus { border-color: #ff0000; background: rgba(255,255,255,0.08); }

.guest-btn {
    background: linear-gradient(135deg, #ff0000, #cc0000);
    color: white;
    border: none;
    padding: 14px 24px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
    box-shadow: 0 6px 20px rgba(255,0,0,0.3);
    transition: all 0.2s;
}
.guest-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(255,0,0,0.4); }
.guest-btn:active { transform: translateY(0); }

.features-list {
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid rgba(255,255,255,0.08);
}
.feature-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 0;
    color: rgba(255,255,255,0.6);
    font-size: 12px;
    font-weight: 500;
}
.feature-item .check { color: #00ff88; font-weight: 900; font-size: 13px; }

.privacy-note {
    text-align: center;
    color: rgba(255,255,255,0.3);
    font-size: 10px;
    margin-top: 16px;
    line-height: 1.6;
}

/* ============ MOBILE OPTIMIZATIONS ============ */
@media (max-width: 480px) {
    body { padding: 12px; }
    
    .login-container {
        padding: 28px 20px;
        border-radius: 18px;
        max-width: 100%;
    }
    
    .logo-section { margin-bottom: 24px; }
    
    /* Smaller F12 logo on mobile */
    .f12-logo-inner { padding: 10px 22px; }
    .f12-text { font-size: 28px; letter-spacing: -1.5px; }
    
    .logo-title { font-size: 22px; }
    .logo-subtitle { font-size: 10px; }
    
    .form-section h2 { font-size: 18px; }
    .form-section p { font-size: 12px; margin-bottom: 20px; }
    
    /* Google button mobile */
    .google-fallback {
        padding: 11px 16px;
        font-size: 13px;
        gap: 8px;
    }
    .google-fallback svg { width: 16px; height: 16px; }
    
    /* Smaller Google sign-in button */
    #google-signin-btn iframe { transform: scale(0.9); }
    
    .form-group input {
        padding: 12px 14px;
        font-size: 14px;
    }
    
    .guest-btn {
        padding: 13px 20px;
        font-size: 13px;
    }
    
    .divider { margin: 14px 0; font-size: 10px; }
    
    .features-list { margin-top: 20px; padding-top: 16px; }
    .feature-item { font-size: 11px; padding: 5px 0; }
    
    .privacy-note { font-size: 9px; }
}

/* Very small screens */
@media (max-width: 360px) {
    .f12-text { font-size: 24px; }
    .f12-logo-inner { padding: 8px 18px; }
    .logo-title { font-size: 20px; }
}
</style>
</head>
<body>
<div class="bg-animation"></div>
<div class="login-container">
<div class="logo-section">
<div class="f12-logo-wrapper">
<div class="f12-logo-inner">
<div class="f12-text">
<span class="f">F</span><span class="num">12</span>
</div>
</div>
</div>
<div class="logo-title">F12 <span>ORBIT</span></div>
<div class="logo-subtitle">Live • Connect • Share</div>
</div>
<div class="form-section">
<h2>Welcome back</h2>
<p>Sign in to continue</p>

<div id="google-signin-btn"></div>

<button class="google-fallback" id="google-fallback-btn" onclick="manualGoogleSignIn()">
<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
<path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
<path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
<path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
</svg>
Continue with Google
</button>

<div class="divider"><span>or as guest</span></div>

<div class="form-group">
<input type="text" id="user-name" placeholder="Enter your name" maxlength="20">
</div>

<button class="guest-btn" onclick="loginGuest()">Enter as Guest</button>

<div class="features-list">
<div class="feature-item"><span class="check">✓</span><span>HD Live Streaming</span></div>
<div class="feature-item"><span class="check">✓</span><span>Direct Messaging</span></div>
<div class="feature-item"><span class="check">✓</span><span>See who's online</span></div>
</div>

<div class="privacy-note">
By continuing, you agree to F12 ORBIT's terms.<br>
Your videos are NOT saved.
</div>

</div>
</div>

<script>
const GOOGLE_CLIENT_ID = '945132021311-ohtqcdmijm1tmdbl4onhrjhke597f679.apps.googleusercontent.com';

const savedName = localStorage.getItem('f12_username');
if (savedName) { document.getElementById('user-name').value = savedName; }

function loginGuest() {
    const name = document.getElementById('user-name').value.trim();
    if (!name) { alert('Please enter your name!'); return; }
    if (name.length < 2) { alert('Name must be at least 2 characters!'); return; }
    localStorage.setItem('f12_username', name);
    localStorage.setItem('f12_avatar', name.charAt(0).toUpperCase());
    localStorage.removeItem('f12_photo');
    localStorage.removeItem('f12_email');
    if (!localStorage.getItem('f12_member_since')) {
        localStorage.setItem('f12_member_since', new Date().toISOString());
    }
    window.location.href = '/';
}

document.getElementById('user-name').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') loginGuest();
});

function decodeJwtResponse(token) {
    const base64Url = token.split('.')[1];
    const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
    const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => {
        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
    }).join(''));
    return JSON.parse(jsonPayload);
}

function handleGoogleSignIn(response) {
    try {
        const userData = decodeJwtResponse(response.credential);
        localStorage.setItem('f12_username', userData.name);
        localStorage.setItem('f12_email', userData.email);
        localStorage.setItem('f12_photo', userData.picture);
        localStorage.setItem('f12_avatar', userData.name.charAt(0).toUpperCase());
        if (!localStorage.getItem('f12_member_since')) {
            localStorage.setItem('f12_member_since', new Date().toISOString());
        }
        window.location.href = '/';
    } catch (e) {
        console.error('Sign-in error:', e);
        alert('Sign-in failed. Please try again.');
    }
}

function manualGoogleSignIn() {
    if (typeof google !== 'undefined') {
        google.accounts.id.prompt();
    } else {
        alert('Google Sign-In is loading. Please wait and try again.');
    }
}

window.addEventListener('load', () => {
    try {
        if (typeof google !== 'undefined') {
            google.accounts.id.initialize({
                client_id: GOOGLE_CLIENT_ID,
                callback: handleGoogleSignIn,
                auto_select: false
            });
            
            const isMobile = window.innerWidth <= 480;
            google.accounts.id.renderButton(
                document.getElementById('google-signin-btn'),
                { 
                    theme: 'filled_black', 
                    size: 'large', 
                    width: isMobile ? 280 : 320, 
                    text: 'continue_with',
                    shape: 'pill'
                }
            );
            
            setTimeout(() => {
                const googleBtn = document.getElementById('google-signin-btn');
                if (googleBtn && googleBtn.children.length > 0) {
                    document.getElementById('google-fallback-btn').style.display = 'none';
                }
            }, 1500);
        }
    } catch (e) {
        console.error('Google Sign-In init error:', e);
    }
});
</script>

</body>
</html>
