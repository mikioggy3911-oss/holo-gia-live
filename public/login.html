<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - F12 ORBIT</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', sans-serif; }
body { background: #000; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.login-container { max-width: 420px; width: 100%; background: #1f1f1f; border-radius: 20px; padding: 40px 30px; border: 1px solid #303030; box-shadow: 0 20px 60px rgba(0,0,0,0.8); }
.logo-section { text-align: center; margin-bottom: 30px; }
.f12-logo { display: inline-flex; align-items: center; justify-content: center; padding: 20px 35px; background: #000; border: 4px solid; border-image: linear-gradient(135deg, #fff 0%, #fff 50%, #ff0000 50%, #ff0000 100%) 1; border-radius: 30px; position: relative; margin-bottom: 20px; box-shadow: 0 0 30px rgba(255,0,0,0.3); }
.f12-text { font-size: 48px; font-weight: 900; letter-spacing: -2px; font-style: italic; line-height: 1; }
.f12-text .f { color: #fff; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
.f12-text .num { color: #ff0000; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
.logo-title { font-size: 28px; font-weight: 900; letter-spacing: -1px; margin-bottom: 8px; }
.logo-title span { color: #ff0000; }
.logo-subtitle { color: #aaa; font-size: 14px; }
.form-section h2 { font-size: 20px; margin-bottom: 8px; text-align: center; }
.form-section p { color: #aaa; font-size: 14px; text-align: center; margin-bottom: 24px; }
.form-group { margin-bottom: 16px; }
.form-group input { width: 100%; padding: 14px 16px; background: #0f0f0f; border: 1px solid #303030; border-radius: 10px; color: #fff; font-size: 15px; outline: none; }
.form-group input:focus { border-color: #ff0000; }
.login-btn { background: linear-gradient(135deg, #ff0000, #cc0000); color: white; border: none; padding: 14px 24px; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; width: 100%; margin-bottom: 16px; box-shadow: 0 4px 15px rgba(255,0,0,0.3); }
.login-btn:hover { transform: translateY(-2px); }
.divider { display: flex; align-items: center; margin: 20px 0; color: #555; font-size: 13px; }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #303030; }
.divider span { padding: 0 12px; }
.google-btn { background: white; color: #333; border: none; padding: 14px 24px; border-radius: 10px; font-size: 15px; font-weight: 500; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; opacity: 0.7; }
.google-btn:hover { opacity: 1; }
.google-note { text-align: center; color: #666; font-size: 12px; margin-top: 16px; }
.features-list { margin-top: 24px; padding-top: 20px; border-top: 1px solid #303030; }
.feature-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; color: #aaa; font-size: 13px; }
.feature-item .check { color: #00ff00; font-weight: 700; }
</style>
</head>
<body>
<div class="login-container">
<div class="logo-section">
<div class="f12-logo">
<div class="f12-text"><span class="f">F</span><span class="num">12</span></div>
</div>
<div class="logo-title">F12 <span>ORBIT</span></div>
<div class="logo-subtitle">Live Stream and Messaging Platform</div>
</div>
<div class="form-section">
<h2>Welcome!</h2>
<p>Enter your name to continue</p>
<div class="form-group">
<input type="text" id="user-name" placeholder="Your name" maxlength="20" autofocus>
</div>
<button class="login-btn" onclick="loginUser()">Enter F12 ORBIT</button>
<div class="divider"><span>OR</span></div>
<button class="google-btn" onclick="googleLoginSoon()">Continue with Google</button>
<div class="google-note">* Google login coming soon!</div>
<div class="features-list">
<div class="feature-item"><span class="check">✓</span><span>Live Streaming with Chat</span></div>
<div class="feature-item"><span class="check">✓</span><span>Direct Messaging</span></div>
<div class="feature-item"><span class="check">✓</span><span>See who is online</span></div>
<div class="feature-item"><span class="check">✓</span><span>Notifications</span></div>
</div>
</div>
</div>
<script>
const savedName = localStorage.getItem('f12_username');
if (savedName) { document.getElementById('user-name').value = savedName; }
function loginUser() {
const name = document.getElementById('user-name').value.trim();
if (!name) { alert('Please enter your name!'); return; }
if (name.length < 2) { alert('Name must be at least 2 characters!'); return; }
localStorage.setItem('f12_username', name);
localStorage.setItem('f12_avatar', name.charAt(0).toUpperCase());
window.location.href = '/';
}
function googleLoginSoon() { alert('Google Login coming soon!'); }
document.getElementById('user-name').addEventListener('keypress', (e) => { if (e.key === 'Enter') loginUser(); });
</script>
</body>
</html>
