<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Go Live - F12 ORBIT</title>
<script src="/socket.io/socket.io.js"></script>
<script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#7c3aed;
  --primary2:#a855f7;
  --bg:#0a0a0f;
  --bg2:#13131a;
  --bg3:#1a1a2e;
  --card:#1e1e2e;
  --card2:#252538;
  --border:#2a2a3e;
  --text:#ffffff;
  --text2:#a0a0b8;
  --red:#ef4444;
  --green:#22c55e;
  --gold:#f59e0b;
  --pink:#ec4899;
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',sans-serif;min-height:100vh;padding-bottom:20px}
.top-nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(10,10,15,.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.nav-logo{font-size:18px;font-weight:800;background:linear-gradient(135deg,var(--primary),var(--primary2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.back-btn{background:var(--card);border:1px solid var(--border);color:var(--text);padding:7px 14px;border-radius:20px;font-size:13px;cursor:pointer}
.back-btn:hover{background:var(--primary);border-color:var(--primary)}
.main{padding-top:70px;max-width:900px;margin:0 auto;padding-left:16px;padding-right:16px}

/* SETUP / LIVE LAYOUT */
.setup-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:24px;margin-top:16px;margin-bottom:16px}
.setup-title{font-size:18px;font-weight:800;margin-bottom:20px;display:flex;align-items:center;gap:8px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.form-input{width:100%;padding:10px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:14px;outline:none;transition:border .2s;font-family:inherit}
.form-input:focus{border-color:var(--primary)}
.go-live-btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--red),var(--pink));color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:800;cursor:pointer;transition:opacity .2s;letter-spacing:.5px}
.go-live-btn:hover{opacity:.9}
.go-live-btn:disabled{opacity:.5;cursor:not-allowed}

/* CAMERA PREVIEW */
.preview-wrap{position:relative;width:100%;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:16/9;margin-bottom:16px}
#localVideo{width:100%;height:100%;object-fit:cover;display:block}
.preview-overlay{position:absolute;top:12px;left:12px;display:flex;gap:8px}
.live-indicator{background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:4px 10px;border-radius:10px;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.duration-badge{background:rgba(0,0,0,.7);color:#fff;font-size:12px;padding:4px 10px;border-radius:10px}

/* LIVE LAYOUT */
.live-layout{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:768px){.live-layout{grid-template-columns:1fr 380px}}

/* ANALYTICS LIVE */
.analytics-live{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px}
.analytics-live-title{font-size:14px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:6px}
.analytics-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.analytics-card{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center}
.analytics-card .ac-icon{font-size:22px;margin-bottom:4px}
.analytics-card .ac-value{font-size:20px;font-weight:800;color:var(--primary2)}
.analytics-card .ac-label{font-size:10px;color:var(--text2);margin-top:2px}

/* CHAT LIVE */
.chat-live{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;max-height:480px}
.chat-live-header{padding:14px 16px;border-bottom:1px solid var(--border);font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.chat-live-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.chat-live-msgs::-webkit-scrollbar{width:4px}
.chat-live-msgs::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.chat-msg-item{display:flex;gap:8px;align-items:flex-start}
.chat-msg-av{width:26px;height:26px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;overflow:hidden}
.chat-msg-av img{width:100%;height:100%;object-fit:cover}
.chat-msg-body2{flex:1}
.chat-msg-name2{font-size:11px;font-weight:700;color:var(--primary2)}
.chat-msg-text2{font-size:13px;margin-top:2px;word-break:break-word}
.system-msg{text-align:center;font-size:11px;color:var(--text2);padding:4px;background:var(--bg3);border-radius:8px}
.chat-live-input{border-top:1px solid var(--border);padding:10px;display:flex;gap:8px}
.chat-live-input input{flex:1;padding:8px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:20px;color:var(--text);font-size:13px;outline:none}
.chat-live-input input:focus{border-color:var(--primary)}
.chat-live-send{background:var(--primary);color:#fff;border:none;padding:8px 16px;border-radius:20px;font-size:13px;cursor:pointer;font-weight:600}

/* POLL CREATOR */
.poll-creator{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-top:16px}
.poll-creator-title{font-size:14px;font-weight:700;margin-bottom:12px}
.poll-opt-input{display:flex;gap:6px;margin-bottom:8px}
.poll-opt-input input{flex:1;padding:8px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:13px;outline:none}
.poll-opt-input input:focus{border-color:var(--primary)}
.add-opt-btn{background:var(--bg3);border:1px solid var(--border);color:var(--text2);padding:6px 12px;border-radius:10px;font-size:12px;cursor:pointer}
.add-opt-btn:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
.launch-poll-btn{width:100%;padding:10px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px}

/* CONTROLS */
.stream-controls{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.ctrl-btn{flex:1;min-width:100px;padding:12px;border-radius:12px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px}
.ctrl-btn:hover{background:var(--primary);border-color:var(--primary)}
.ctrl-btn.danger{border-color:var(--red);color:var(--red)}
.ctrl-btn.danger:hover{background:var(--red);color:#fff}
.ctrl-btn.active{background:var(--primary);border-color:var(--primary)}

/* FLOATING */
.hearts-live{position:fixed;bottom:80px;right:20px;width:50px;pointer-events:none}
.heart-fly{font-size:24px;animation:heartFly 2s ease-out forwards;display:block}
@keyframes heartFly{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-200px) scale(.4)}}

/* REACTION LIVE */
.reaction-popup{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);font-size:32px;animation:reactionPop .8s ease-out forwards;pointer-events:none;z-index:100}
@keyframes reactionPop{0%{opacity:1;transform:translateX(-50%) scale(1.5)}100%{opacity:0;transform:translateX(-50%) scale(.5) translateY(-40px)}}

/* GIFT SHOW */
.gift-show{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.85);border:2px solid var(--gold);border-radius:20px;padding:20px 30px;text-align:center;z-index:200;animation:giftPop .4s ease}
@keyframes giftPop{0%{transform:translate(-50%,-50%) scale(.5);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
.gift-show-emoji{font-size:48px}
.gift-show-text{font-size:14px;margin-top:8px}

/* TOAST */
.toast-container{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:500;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:rgba(0,0,0,.85);border:1px solid var(--border);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;animation:fadeUp .3s ease;white-space:nowrap}
.toast.success{border-color:var(--green)}
.toast.error{border-color:var(--red)}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<nav class="top-nav">
  <button class="back-btn" onclick="safeGoBack()">← Back</button>
  <div class="nav-logo">🔴 Go Live</div>
  <div id="liveStatusBadge" style="display:none;background:var(--red);color:#fff;font-size:12px;font-weight:700;padding:5px 12px;border-radius:20px;animation:pulse 1.5s infinite">● LIVE</div>
</nav>

<div class="main">

  <!-- SETUP -->
  <div id="setupSection">
    <div class="setup-card">
      <div class="setup-title">🎬 Stream Setup</div>

      <div class="preview-wrap">
        <video id="localVideo" autoplay muted playsinline></video>
      </div>

      <div class="form-group">
        <label>Stream Title *</label>
        <input class="form-input" id="titleInput" type="text" placeholder="What are you streaming today?" maxlength="80"/>
      </div>
      <div class="form-group">
        <label>Category</label>
        <select class="form-input" id="categoryInput">
          <option value="Chat">💬 Chat</option>
          <option value="Gaming">🎮 Gaming</option>
          <option value="Music">🎵 Music</option>
          <option value="Art">🎨 Art</option>
          <option value="Education">📚 Education</option>
          <option value="Sports">⚽ Sports</option>
          <option value="Cooking">🍳 Cooking</option>
          <option value="Travel">✈️ Travel</option>
          <option value="Tech">💻 Tech</option>
          <option value="Just Chatting">🙂 Just Chatting</option>
        </select>
      </div>
      <div style="display:flex;gap:10px;margin-bottom:14px">
        <button onclick="toggleCamera()" style="flex:1;padding:10px;background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:12px;font-size:13px;cursor:pointer" id="camBtn">📷 Camera ON</button>
        <button onclick="toggleMic()" style="flex:1;padding:10px;background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:12px;font-size:13px;cursor:pointer" id="micBtn">🎤 Mic ON</button>
      </div>
      <button class="go-live-btn" onclick="startStream()" id="goLiveBtn">🔴 GO LIVE!</button>
    </div>
  </div>

  <!-- LIVE SECTION -->
  <div id="liveSection" style="display:none">
    <div style="margin-top:16px">
      <div class="preview-wrap">
        <video id="localVideoLive" autoplay muted playsinline></video>
        <div class="preview-overlay">
          <div class="live-indicator">● LIVE</div>
          <div class="duration-badge" id="liveDuration">00:00</div>
        </div>
      </div>

      <div class="stream-controls">
        <button class="ctrl-btn" onclick="toggleLiveCamera()" id="liveCamBtn">📷 Camera</button>
        <button class="ctrl-btn" onclick="toggleLiveMic()" id="liveMicBtn">🎤 Mic</button>
        <button class="ctrl-btn" onclick="shareStream()">🔗 Share</button>
        <button class="ctrl-btn danger" onclick="endStream()">⏹️ End Stream</button>
      </div>
    </div>

    <div class="live-layout" style="margin-top:16px">

      <!-- LEFT: Analytics + Poll -->
      <div>
        <div class="analytics-live">
          <div class="analytics-live-title">📊 Live Analytics</div>
          <div class="analytics-grid">
            <div class="analytics-card">
              <div class="ac-icon">👁️</div>
              <div class="ac-value" id="liveViewers">0</div>
              <div class="ac-label">Viewers</div>
            </div>
            <div class="analytics-card">
              <div class="ac-icon">📈</div>
              <div class="ac-value" id="livePeakViewers">0</div>
              <div class="ac-label">Peak</div>
            </div>
            <div class="analytics-card">
              <div class="ac-icon">❤️</div>
              <div class="ac-value" id="liveLikes">0</div>
              <div class="ac-label">Likes</div>
            </div>
            <div class="analytics-card">
              <div class="ac-icon">💬</div>
              <div class="ac-value" id="liveMessages">0</div>
              <div class="ac-label">Messages</div>
            </div>
            <div class="analytics-card">
              <div class="ac-icon">😍</div>
              <div class="ac-value" id="liveReactions">0</div>
              <div class="ac-label">Reactions</div>
            </div>
            <div class="analytics-card">
              <div class="ac-icon">🎁</div>
              <div class="ac-value" id="liveGifts">0</div>
              <div class="ac-label">Gifts</div>
            </div>
            <div class="analytics-card">
              <div class="ac-icon">🚪</div>
              <div class="ac-value" id="liveJoins">0</div>
              <div class="ac-label">Joins</div>
            </div>
            <div class="analytics-card">
              <div class="ac-icon">🌟</div>
              <div class="ac-value" id="liveUnique">0</div>
              <div class="ac-label">Unique</div>
            </div>
          </div>
        </div>

        <!-- POLL CREATOR -->
        <div class="poll-creator">
          <div class="poll-creator-title">🗳️ Create Poll</div>
          <div class="form-group">
            <label>Question</label>
            <input class="form-input" id="pollQuestion" placeholder="Ask your viewers..."/>
          </div>
          <div id="pollOptions">
            <div class="poll-opt-input">
              <input placeholder="Option 1" id="pollOpt0" class="form-input" style="padding:8px 12px"/>
            </div>
            <div class="poll-opt-input">
              <input placeholder="Option 2" id="pollOpt1" class="form-input" style="padding:8px 12px"/>
            </div>
          </div>
          <button class="add-opt-btn" onclick="addPollOption()">+ Add Option</button>
          <button class="launch-poll-btn" onclick="launchPoll()">🗳️ Launch Poll</button>
        </div>
      </div>

      <!-- RIGHT: Chat -->
      <div class="chat-live">
        <div class="chat-live-header">💬 Live Chat <span id="chatMsgCount" style="font-size:12px;color:var(--text2);font-weight:400">0 messages</span></div>
        <div class="chat-live-msgs" id="liveChatMsgs">
          <div class="system-msg">Stream started! Say hi 👋</div>
        </div>
        <div class="chat-live-input">
          <input type="text" id="streamerChatInput" placeholder="Reply to chat..." onkeydown="if(event.key==='Enter')sendStreamerChat()"/>
          <button class="chat-live-send" onclick="sendStreamerChat()">Send</button>
        </div>
      </div>

    </div>
  </div>

</div>

<div class="hearts-live" id="heartsLive"></div>
<div class="toast-container" id="toastContainer"></div>

<script>
const socket = io();
let myName = '', myPhoto = null, myUserKey = '';
let localStream = null;
let peer = null;
let activeConnections = [];
let currentStreamId = null;
let streamStartedAt = null;
let durationInterval = null;
let cameraOn = true;
let micOn = true;
let chatMsgCount = 0;
let pollOptionCount = 2;

function init() {
  const user = JSON.parse(localStorage.getItem('orbitUser') || '{}');
  myName = user.name || 'Streamer_' + Math.floor(Math.random()*9999);
  myPhoto = user.photo || null;
  myUserKey = user.userKey || ('uk_' + Date.now());

  socket.emit('user-online', {
    name: myName,
    photo: myPhoto,
    userKey: myUserKey,
    status: 'online'
  });

  startCamera();
}

async function startCamera() {
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    const v = document.getElementById('localVideo');
    if(v) { v.srcObject = localStream; v.play().catch(()=>{}); }
  } catch(e) {
    showToast('Camera access denied. Streaming without video.', 'error');
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch(e2) {
      showToast('Mic access also denied.', 'error');
    }
  }
}

function toggleCamera() {
  if(!localStream) return;
  cameraOn = !cameraOn;
  localStream.getVideoTracks().forEach(t => t.enabled = cameraOn);
  document.getElementById('camBtn').textContent = cameraOn ? '📷 Camera ON' : '📷 Camera OFF';
  document.getElementById('camBtn').style.borderColor = cameraOn ? '' : 'var(--red)';
}

function toggleMic() {
  if(!localStream) return;
  micOn = !micOn;
  localStream.getAudioTracks().forEach(t => t.enabled = micOn);
  document.getElementById('micBtn').textContent = micOn ? '🎤 Mic ON' : '🎤 Mic OFF';
  document.getElementById('micBtn').style.borderColor = micOn ? '' : 'var(--red)';
}

function toggleLiveCamera() {
  if(!localStream) return;
  cameraOn = !cameraOn;
  localStream.getVideoTracks().forEach(t => t.enabled = cameraOn);
  const btn = document.getElementById('liveCamBtn');
  if(btn) { btn.textContent = cameraOn ? '📷 Camera' : '📷 No Cam'; btn.classList.toggle('active', cameraOn); }
}

function toggleLiveMic() {
  if(!localStream) return;
  micOn = !micOn;
  localStream.getAudioTracks().forEach(t => t.enabled = micOn);
  const btn = document.getElementById('liveMicBtn');
  if(btn) { btn.textContent = micOn ? '🎤 Mic' : '🔇 Muted'; btn.classList.toggle('active', micOn); }
}

async function startStream() {
  const title = document.getElementById('titleInput').value.trim();
  if(!title) { showToast('Please enter a stream title', 'error'); return; }

  const btn = document.getElementById('goLiveBtn');
  btn.disabled = true;
  btn.textContent = '⏳ Starting...';

  try {
    if(!localStream) await startCamera();

    peer = new Peer(undefined, {
      host: location.hostname,
      port: location.port || (location.protocol === 'https:' ? 443 : 80),
      path: '/peerjs',
      secure: location.protocol === 'https:'
    });

    peer.on('open', peerId => {
      socket.emit('start-stream', {
        title,
        streamerName: myName,
        streamerPhoto: myPhoto,
        category: document.getElementById('categoryInput').value,
        peerId,
        userKey: myUserKey
      });
    });

    peer.on('call', call => {
      call.answer(localStream);
      activeConnections.push(call);
    });

    peer.on('error', err => {
      console.warn('PeerJS err:', err.type);
      socket.emit('start-stream', {
        title,
        streamerName: myName,
        streamerPhoto: myPhoto,
        category: document.getElementById('categoryInput').value,
        peerId: null,
        userKey: myUserKey
      });
    });

  } catch(e) {
    showToast('Failed to start stream: ' + e.message, 'error');
    btn.disabled = false;
    btn.textContent = '🔴 GO LIVE!';
  }
}

function goLive(streamId) {
  currentStreamId = streamId;
  streamStartedAt = new Date();

  document.getElementById('setupSection').style.display = 'none';
  document.getElementById('liveSection').style.display = 'block';
  document.getElementById('liveStatusBadge').style.display = 'flex';

  const liveVid = document.getElementById('localVideoLive');
  if(liveVid && localStream) { liveVid.srcObject = localStream; liveVid.play().catch(()=>{}); }

  durationInterval = setInterval(updateDuration, 1000);
  showToast('🔴 You are now LIVE!', 'success');
}

function updateDuration() {
  if(!streamStartedAt) return;
  const diff = Math.floor((Date.now() - streamStartedAt.getTime()) / 1000);
  const h = Math.floor(diff / 3600);
  const m = Math.floor((diff % 3600) / 60);
  const s = diff % 60;
  const str = h > 0 ? `${pad(h)}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
  const el = document.getElementById('liveDuration');
  if(el) el.textContent = str;
}

function pad(n) { return String(n).padStart(2,'0'); }

function endStream() {
  if(!confirm('End stream? This cannot be undone.')) return;
  socket.emit('end-stream');
  cleanup();
  showToast('Stream ended. Redirecting...', 'success');
  setTimeout(() => location.href = '/', 2000);
}

function cleanup() {
  if(durationInterval) clearInterval(durationInterval);
  if(localStream) { localStream.getTracks().forEach(t => t.stop()); }
  if(peer) { peer.destroy(); peer = null; }
  activeConnections = [];
  currentStreamId = null;
}

function safeGoBack() {
  if(currentStreamId) {
    if(!confirm('You are live! End stream and go back?')) return;
    socket.emit('end-stream');
    cleanup();
  }
  location.href = '/';
}

function shareStream() {
  if(!currentStreamId) return;
  const url = location.origin + '/watch/' + currentStreamId;
  if(navigator.share) {
    navigator.share({ title: 'Watch my stream!', url }).catch(()=>{});
  } else {
    navigator.clipboard.writeText(url).then(() => showToast('Stream link copied! 🔗', 'success')).catch(() => {
      prompt('Copy this link:', url);
    });
  }
}

function sendStreamerChat() {
  const input = document.getElementById('streamerChatInput');
  const msg = input.value.trim();
  if(!msg || !currentStreamId) return;
  socket.emit('chat-message', {
    streamId: currentStreamId,
    name: myName + ' (Host)',
    photo: myPhoto,
    message: msg
  });
  input.value = '';
}

// POLL
function addPollOption() {
  if(pollOptionCount >= 5) { showToast('Max 5 options', 'error'); return; }
  const container = document.getElementById('pollOptions');
  const div = document.createElement('div');
  div.className = 'poll-opt-input';
  div.innerHTML = `<input placeholder="Option ${pollOptionCount+1}" id="pollOpt${pollOptionCount}" class="form-input" style="padding:8px 12px"/>`;
  container.appendChild(div);
  pollOptionCount++;
}

function launchPoll() {
  if(!currentStreamId) { showToast('Start streaming first', 'error'); return; }
  const q = document.getElementById('pollQuestion').value.trim();
  if(!q) { showToast('Enter poll question', 'error'); return; }
  const options = [];
  for(let i = 0; i < pollOptionCount; i++) {
    const el = document.getElementById('pollOpt' + i);
    if(el && el.value.trim()) options.push({ text: el.value.trim(), votes: 0 });
  }
  if(options.length < 2) { showToast('Need at least 2 options', 'error'); return; }
  socket.emit('launch-poll', { streamId: currentStreamId, question: q, options });
  showToast('Poll launched! 🗳️', 'success');
  document.getElementById('pollQuestion').value = '';
}

// ANALYTICS UPDATE
function updateAnalytics(data) {
  if(!data) return;
  const set = (id, val) => {
    const el = document.getElementById(id);
    if(el) el.textContent = val ?? 0;
  };
  set('liveViewers', data.uniqueViewers ?? 0);
  set('livePeakViewers', data.peakViewers ?? 0);
  set('liveLikes', data.totalLikes ?? 0);
  set('liveMessages', data.totalMessages ?? 0);
  set('liveReactions', data.totalReactions ?? 0);
  set('liveGifts', data.totalGifts ?? 0);
  set('liveJoins', data.joinCount ?? 0);
  set('liveUnique', data.uniqueViewers ?? 0);
}

// FLOATING HEART
function spawnHeart() {
  const c = document.getElementById('heartsLive');
  const h = document.createElement('span');
  h.className = 'heart-fly';
  const emojis = ['❤️','🧡','💛','💚','💙','💜'];
  h.textContent = emojis[Math.floor(Math.random() * emojis.length)];
  c.appendChild(h);
  setTimeout(() => h.remove(), 2000);
}

function showGiftAnimation(gift, fromName) {
  const existing = document.querySelector('.gift-show');
  if(existing) existing.remove();
  const div = document.createElement('div');
  div.className = 'gift-show';
  div.innerHTML = `<div class="gift-show-emoji">${gift.split(' ')[0]}</div>
    <div class="gift-show-text"><strong>${escHtml(fromName)}</strong> sent ${escHtml(gift)}! 🎉</div>`;
  document.body.appendChild(div);
  setTimeout(() => div.remove(), 2500);
}

function showToast(msg, type='info') {
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => { t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),300); }, 3000);
}

function escHtml(str) {
  if(!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// SOCKET
socket.on('connect', init);

socket.on('stream-started', data => {
  goLive(data.streamId);
});

socket.on('viewer-count', data => {
  const el = document.getElementById('liveViewers');
  if(el) el.textContent = data.count;
});

socket.on('analytics-updated', data => {
  updateAnalytics(data);
});

socket.on('stream-liked', data => {
  spawnHeart();
  showToast(`❤️ ${data.fromName} liked your stream!`);
  const el = document.getElementById('liveLikes');
  if(el) el.textContent = data.likes;
});

socket.on('new-reaction', data => {
  const r = document.createElement('div');
  r.className = 'reaction-popup';
  r.textContent = data.emoji;
  document.body.appendChild(r);
  setTimeout(() => r.remove(), 1000);
  showToast(`${data.emoji} ${data.fromName}`);
});

socket.on('new-gift', data => {
  showGiftAnimation(data.gift, data.fromName);
});

socket.on('new-message', data => {
  const box = document.getElementById('liveChatMsgs');
  if(!box) return;
  chatMsgCount++;
  const countEl = document.getElementById('chatMsgCount');
  if(countEl) countEl.textContent = chatMsgCount + ' messages';
  const div = document.createElement('div');
  div.className = 'chat-msg-item';
  const avHTML = data.photo
    ? `<img src="${data.photo}" alt="${data.name}">`
    : (data.name||'?').charAt(0).toUpperCase();
  div.innerHTML = `<div class="chat-msg-av">${avHTML}</div>
    <div class="chat-msg-body2">
      <div class="chat-msg-name2">${escHtml(data.name)}</div>
      <div class="chat-msg-text2">${escHtml(data.message)}</div>
    </div>`;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
});

socket.on('new-notification', data => {
  showToast(`🔔 ${data.text}`);
});

socket.on('stream-ended', () => {
  cleanup();
  location.href = '/';
});

window.addEventListener('beforeunload', () => {
  if(currentStreamId) {
    socket.emit('end-stream');
    cleanup();
  }
});
</script>
</body>
</html>
