<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go Live - F12 ORBIT</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
body { background: #0a0a0a; color: #fff; min-height: 100vh; }
.header { background: rgba(10,10,10,0.85); padding: 0 20px; height: 60px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.06); }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: white; }
.f12-logo-wrapper { display: inline-block; padding: 2px; border-radius: 18px; background: linear-gradient(90deg, #fff 0%, #d0d0d0 40%, #a8a8a8 49%, #ff3333 51%, #cc0000 70%, #880000 100%); }
.f12-logo-inner { display: inline-flex; align-items: center; padding: 6px 14px; background: #000; border-radius: 16px; }
.f12-text-logo { font-family: 'Orbitron', sans-serif; font-size: 18px; font-weight: 900; letter-spacing: -1.5px; font-style: italic; display: flex; }
.f12-text-logo .f { color: #fff; }
.f12-text-logo .num { color: #ff0000; }
.logo-text { font-size: 15px; font-weight: 800; }
.logo-text span { color: #ff0000; }
.back-btn { background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1); padding: 10px 18px; border-radius: 22px; text-decoration: none; font-size: 14px; font-weight: 600; }
.container { max-width: 1000px; margin: 0 auto; padding: 24px; }
.setup-card { background: rgba(20,20,20,0.5); border-radius: 16px; padding: 32px; margin-bottom: 16px; border: 1px solid rgba(255,255,255,0.08); }
.setup-card h2 { font-size: 24px; margin-bottom: 8px; }
.subtitle { color: rgba(255,255,255,0.5); margin-bottom: 24px; font-size: 14px; }
.form-group { margin-bottom: 20px; }
.form-group label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.7); text-transform: uppercase; }
.form-group input, .form-group select { width: 100%; padding: 14px 16px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 11px; color: #fff; font-size: 15px; outline: none; }
.form-group input:focus, .form-group select:focus { border-color: #ff0000; }
.start-btn { background: linear-gradient(135deg, #ff0000, #cc0000); color: white; border: none; padding: 16px 32px; border-radius: 25px; font-size: 16px; font-weight: 700; cursor: pointer; width: 100%; }
.start-btn:disabled { background: #555; cursor: not-allowed; }
.live-section { display: none; }
.video-wrapper { position: relative; width: 100%; background: #000; border-radius: 16px; overflow: hidden; margin-bottom: 16px; border: 2px solid #ff0000; }
.video-wrapper video { width: 100%; height: auto; max-height: 500px; display: block; }
.live-overlay { position: absolute; top: 16px; left: 16px; display: flex; gap: 10px; z-index: 10; }
.live-badge { background: #ff0000; padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.live-badge .dot { width: 8px; height: 8px; background: white; border-radius: 50%; animation: pulse 1s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
.viewer-badge { background: rgba(0,0,0,0.85); padding: 6px 14px; border-radius: 6px; font-size: 13px; }
.audio-indicator { position: absolute; bottom: 16px; right: 16px; background: rgba(0,0,0,0.85); padding: 8px 14px; border-radius: 20px; display: flex; align-items: center; gap: 10px; z-index: 10; }
.audio-bars { display: flex; gap: 3px; align-items: flex-end; height: 16px; }
.audio-bar { width: 3px; background: #00ff00; border-radius: 2px; height: 3px; }
.controls-card { background: rgba(20,20,20,0.5); border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid rgba(255,255,255,0.08); }
.control-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
.ctrl-btn { background: rgba(255,255,255,0.05); color: white; border: 1px solid rgba(255,255,255,0.1); padding: 10px 20px; border-radius: 11px; font-size: 14px; font-weight: 600; cursor: pointer; flex: 1; min-width: 120px; }
.ctrl-btn.danger { background: #ff0000; border-color: #ff0000; }
.ctrl-btn.muted { background: #555; opacity: 0.7; }
.share-link-box { background: rgba(0,0,0,0.5); padding: 12px 16px; border-radius: 11px; display: none; align-items: center; gap: 10px; border: 1px solid rgba(255,255,255,0.08); margin-top: 10px; }
.share-link-box.show { display: flex; }
.share-link-box .url { flex: 1; color: #4285f4; font-size: 13px; word-break: break-all; font-family: monospace; }
.copy-btn { background: #ff0000; color: white; border: none; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 700; }
.chat-card { background: rgba(20,20,20,0.5); border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.08); }
.chat-header { padding: 14px 16px; background: rgba(255,255,255,0.03); font-weight: 700; font-size: 14px; }
.chat-messages { height: 300px; overflow-y: auto; padding: 12px 16px; }
.chat-message { margin-bottom: 10px; display: flex; gap: 8px; }
.chat-avatar { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, #ff0000, #cc0000); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0; }
.chat-name { font-weight: 500; color: #4285f4; font-size: 13px; margin-right: 6px; }
.chat-text { font-size: 14px; }
.chat-time { font-size: 11px; color: #aaa; margin-top: 2px; }
.chat-input-wrap { display: flex; padding: 12px; gap: 8px; background: rgba(255,255,255,0.03); }
.chat-input-wrap input { flex: 1; padding: 10px 14px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; color: white; font-size: 14px; outline: none; }
.chat-input-wrap button { background: #ff0000; color: white; border: none; padding: 8px 20px; border-radius: 20px; cursor: pointer; font-weight: 500; }
.status-msg { text-align: center; padding: 12px; margin: 10px 0; border-radius: 11px; display: none; font-size: 14px; }
.status-msg.error { background: rgba(255,0,0,0.15); color: #ff5252; display: block; }
@media (max-width: 768px) {
.logo-text { display: none; }
.container { padding: 16px; }
.setup-card { padding: 22px; }
.ctrl-btn { min-width: 100px; font-size: 13px; padding: 9px 14px; }
}
</style>
</head>
<body>
<div class="header">
<a href="/" class="logo">
<div class="f12-logo-wrapper">
<div class="f12-logo-inner">
<div class="f12-text-logo"><span class="f">F</span><span class="num">12</span></div>
</div>
</div>
<div class="logo-text">ORBIT</div>
</a>
<a href="/" class="back-btn">← Back</a>
</div>
<div class="container">
<div id="setup-section">
<div class="setup-card">
<h2>🔴 Go Live</h2>
<p class="subtitle">Set up your live stream</p>
<div class="form-group"><label>Your Name</label><input type="text" id="streamer-name" placeholder="Your name" maxlength="30"></div>
<div class="form-group"><label>Stream Title</label><input type="text" id="stream-title" placeholder="What's your stream about?" maxlength="100"></div>
<div class="form-group"><label>Category</label>
<select id="stream-category">
<option value="Chat">Just Chatting</option>
<option value="Gaming">Gaming</option>
<option value="Music">Music</option>
<option value="Education">Education</option>
<option value="News">News</option>
<option value="Sports">Sports</option>
</select>
</div>
<div id="status" class="status-msg"></div>
<button id="start-stream-btn" class="start-btn" onclick="startStream()">🔴 Start Live Stream</button>
</div>
</div>
<div id="live-section" class="live-section">
<div class="video-wrapper">
<video id="local-video" autoplay muted playsinline></video>
<div class="live-overlay">
<div class="live-badge"><div class="dot"></div>LIVE</div>
<div class="viewer-badge" id="viewer-count">👁 0 watching</div>
</div>
<div class="audio-indicator">
<span>🎤</span>
<div class="audio-bars">
<div class="audio-bar" id="bar1"></div><div class="audio-bar" id="bar2"></div><div class="audio-bar" id="bar3"></div><div class="audio-bar" id="bar4"></div><div class="audio-bar" id="bar5"></div>
</div>
</div>
</div>
<div class="controls-card">
<div class="control-buttons">
<button class="ctrl-btn" id="mic-btn" onclick="toggleMic()">🎤 Mic ON</button>
<button class="ctrl-btn" id="cam-btn" onclick="toggleCam()">📹 Camera ON</button>
<button class="ctrl-btn" onclick="shareStream()">🔗 Share</button>
<button class="ctrl-btn danger" onclick="endStream()">⬛ End Stream</button>
</div>
<div id="share-link-box" class="share-link-box">
<span class="url" id="share-url"></span>
<button class="copy-btn" onclick="copyLink()">Copy</button>
</div>
</div>
<div class="chat-card">
<div class="chat-header">💬 Live Chat</div>
<div id="chat-messages" class="chat-messages"></div>
<div class="chat-input-wrap">
<input type="text" id="chat-input" placeholder="Say something..." onkeypress="if(event.key==='Enter') sendChat()">
<button onclick="sendChat()">Send</button>
</div>
</div>
</div>
</div>
<script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
const username = localStorage.getItem('f12_username');
const userPhoto = localStorage.getItem('f12_photo');
if (username) { document.getElementById('streamer-name').value = username; }
const socket = io();
let localStream = null, peer = null, currentStreamId = null, streamerName = '';
let micEnabled = true, camEnabled = true, audioContext = null, analyser = null;

async function startStream() {
    streamerName = document.getElementById('streamer-name').value.trim();
    const title = document.getElementById('stream-title').value.trim();
    const category = document.getElementById('stream-category').value;
    const status = document.getElementById('status');
    const startBtn = document.getElementById('start-stream-btn');
    if (!streamerName) { status.className = 'status-msg error'; status.textContent = 'Please enter your name!'; return; }
    if (!title) { status.className = 'status-msg error'; status.textContent = 'Please enter stream title!'; return; }
    startBtn.disabled = true;
    startBtn.textContent = '⏳ Starting...';
    try {
        localStream = await navigator.mediaDevices.getUserMedia({
            video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' },
            audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, sampleRate: 48000, channelCount: 2 }
        });
        const audioTracks = localStream.getAudioTracks();
        if (audioTracks.length === 0) throw new Error('No microphone!');
        audioTracks.forEach(track => { track.enabled = true; });
        document.getElementById('local-video').srcObject = localStream;
        setupAudioVisualization(localStream);
        peer = new Peer({ config: { 'iceServers': [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
            { urls: 'stun:stun2.l.google.com:19302' }
        ]}});
        peer.on('open', (peerId) => {
            socket.emit('start-stream', { title: title, streamerName: streamerName, streamerPhoto: userPhoto, category: category, peerId: peerId });
        });
        peer.on('call', (call) => { call.answer(localStream); });
        peer.on('error', (err) => console.error(err));
    } catch (err) {
        status.className = 'status-msg error';
        if (err.name === 'NotAllowedError') status.textContent = 'Please allow camera and microphone!';
        else status.textContent = 'Error: ' + err.message;
        startBtn.disabled = false;
        startBtn.textContent = '🔴 Start Live Stream';
    }
}

function setupAudioVisualization(stream) {
    try {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioContext.createMediaStreamSource(stream);
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;
        source.connect(analyser);
        const dataArray = new Uint8Array(analyser.frequencyBinCount);
        function updateBars() {
            if (!analyser) return;
            analyser.getByteFrequencyData(dataArray);
            const average = dataArray.reduce((a, b) => a + b) / dataArray.length;
            ['bar1', 'bar2', 'bar3', 'bar4', 'bar5'].forEach((id, i) => {
                const bar = document.getElementById(id);
                if (bar) {
                    bar.style.height = Math.min(16, (average / 10) * (i + 1) * 0.3 + 3) + 'px';
                    bar.style.background = average > 30 ? '#00ff00' : '#555';
                }
            });
            requestAnimationFrame(updateBars);
        }
        updateBars();
    } catch (e) {}
}

function toggleMic() {
    if (!localStream) return;
    micEnabled = !micEnabled;
    localStream.getAudioTracks().forEach(t => { t.enabled = micEnabled; });
    const btn = document.getElementById('mic-btn');
    btn.textContent = micEnabled ? '🎤 Mic ON' : '🔇 Mic OFF';
    btn.classList.toggle('muted', !micEnabled);
}

function toggleCam() {
    if (!localStream) return;
    camEnabled = !camEnabled;
    localStream.getVideoTracks().forEach(t => { t.enabled = camEnabled; });
    const btn = document.getElementById('cam-btn');
    btn.textContent = camEnabled ? '📹 Camera ON' : '📷 Camera OFF';
    btn.classList.toggle('muted', !camEnabled);
}

socket.on('stream-started', (data) => {
    currentStreamId = data.streamId;
    document.getElementById('setup-section').style.display = 'none';
    document.getElementById('live-section').style.display = 'block';
});

socket.on('viewer-count', (data) => { document.getElementById('viewer-count').textContent = '👁 ' + data.count + ' watching'; });

socket.on('new-message', (data) => {
    const chatMessages = document.getElementById('chat-messages');
    const msgDiv = document.createElement('div');
    msgDiv.className = 'chat-message';
    msgDiv.innerHTML = '<div class="chat-avatar">' + data.name.charAt(0).toUpperCase() + '</div><div><span class="chat-name">' + data.name + '</span><span class="chat-text">' + data.message + '</span><div class="chat-time">' + data.time + '</div></div>';
    chatMessages.appendChild(msgDiv);
    chatMessages.scrollTop = chatMessages.scrollHeight;
});

function sendChat() {
    const input = document.getElementById('chat-input');
    const message = input.value.trim();
    if (message && currentStreamId) {
        socket.emit('chat-message', { streamId: currentStreamId, name: streamerName + ' (Host)', photo: userPhoto, message: message });
        input.value = '';
    }
}

function shareStream() {
    const box = document.getElementById('share-link-box');
    const url = window.location.origin + '/watch/' + currentStreamId;
    document.getElementById('share-url').textContent = url;
    box.classList.add('show');
}

function copyLink() {
    const url = document.getElementById('share-url').textContent;
    navigator.clipboard.writeText(url).then(() => alert('Link copied!')).catch(() => prompt('Copy:', url));
}

function endStream() {
    if (confirm('End stream?')) {
        socket.emit('end-stream');
        if (localStream) localStream.getTracks().forEach(t => t.stop());
        if (peer) peer.destroy();
        if (audioContext) audioContext.close();
        window.location.href = '/';
    }
}

window.addEventListener('beforeunload', () => {
    if (currentStreamId) { socket.emit('end-stream'); if (localStream) localStream.getTracks().forEach(t => t.stop()); }
});
</script>
</body>
</html>
