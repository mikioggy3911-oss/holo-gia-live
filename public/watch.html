<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch Live - F12 ORBIT</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
body { background: #0a0a0a; color: #fff; min-height: 100vh; }
.header { background: rgba(10,10,10,0.85); padding: 0 20px; height: 60px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.06); }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: white; }
.f12-logo-wrapper { display: inline-block; padding: 2px; border-radius: 18px; background: linear-gradient(90deg, #fff 0%, #d0d0d0 40%, #a8a8a8 49%, #ff3333 51%, #cc0000 70%, #880000 100%); }
.f12-logo-inner { display: inline-flex; align-items: center; padding: 6px 14px; background: #000; border-radius: 16px; }
.f12-text-logo { font-family: 'Orbitron', sans-serif; font-size: 18px; font-weight: 900; letter-spacing: -1.5px; font-style: italic; display: flex; }
.f12-text-logo .f { color: #fff; }
.f12-text-logo .num { color: #ff0000; }
.logo-text { font-size: 15px; font-weight: 800; }
.logo-text span { color: #ff0000; }
.back-btn { background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1); padding: 10px 18px; border-radius: 22px; text-decoration: none; font-size: 14px; font-weight: 600; }
.container { max-width: 1400px; margin: 0 auto; padding: 24px; display: grid; grid-template-columns: 1fr 380px; gap: 20px; }
@media (max-width: 1024px) { .container { grid-template-columns: 1fr; } }
.name-section { background: rgba(20,20,20,0.5); border-radius: 16px; padding: 40px; text-align: center; border: 1px solid rgba(255,255,255,0.08); }
.name-section h2 { font-size: 24px; margin-bottom: 8px; }
.name-section p { color: rgba(255,255,255,0.5); margin-bottom: 24px; font-size: 14px; }
.name-section input { padding: 14px 18px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 11px; color: #fff; font-size: 15px; outline: none; width: 100%; max-width: 350px; margin-bottom: 16px; }
.join-btn { background: linear-gradient(135deg, #ff0000, #cc0000); color: white; border: none; padding: 14px 32px; border-radius: 25px; font-size: 15px; cursor: pointer; font-weight: 700; }
.watch-section { display: none; }
.video-wrapper { position: relative; width: 100%; background: #000; border-radius: 12px; overflow: hidden; margin-bottom: 16px; }
.video-wrapper video { width: 100%; height: auto; max-height: 600px; display: block; }
.live-overlay { position: absolute; top: 16px; left: 16px; display: flex; gap: 10px; z-index: 10; }
.live-badge { background: #ff0000; padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.live-badge .dot { width: 8px; height: 8px; background: white; border-radius: 50%; animation: pulse 1s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
.viewer-badge { background: rgba(0,0,0,0.85); padding: 6px 14px; border-radius: 6px; font-size: 13px; display: flex; align-items: center; gap: 6px; }
.volume-control { position: absolute; bottom: 16px; right: 16px; background: rgba(0,0,0,0.85); padding: 8px 14px; border-radius: 20px; display: flex; align-items: center; gap: 10px; z-index: 10; }
.volume-btn { background: transparent; border: none; color: white; font-size: 18px; cursor: pointer; }
.volume-slider { width: 80px; cursor: pointer; }
.unmute-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.92); display: none; align-items: center; justify-content: center; flex-direction: column; cursor: pointer; z-index: 20; }
.unmute-overlay.show { display: flex; }
.unmute-overlay .icon { font-size: 80px; margin-bottom: 16px; }
.unmute-overlay .text { font-size: 20px; font-weight: 700; }

/* FLOATING HEARTS */
.hearts-container { position: absolute; bottom: 80px; right: 16px; pointer-events: none; z-index: 15; width: 60px; height: 400px; overflow: hidden; }
.floating-heart { position: absolute; bottom: 0; font-size: 30px; animation: floatUp 3s linear forwards; opacity: 1; }
@keyframes floatUp {
    0% { bottom: 0; opacity: 1; transform: translateX(0) scale(1) rotate(0deg); }
    100% { bottom: 400px; opacity: 0; transform: translateX(var(--x-drift, 30px)) scale(0.5) rotate(var(--rotate, 30deg)); }
}

/* REACTIONS DISPLAY */
.reactions-container { position: absolute; bottom: 120px; left: 16px; pointer-events: none; z-index: 15; }
.floating-reaction { position: absolute; font-size: 50px; animation: reactionFloat 2.5s ease-out forwards; opacity: 1; }
@keyframes reactionFloat {
    0% { opacity: 0; transform: scale(0); }
    20% { opacity: 1; transform: scale(1.5); }
    100% { opacity: 0; transform: scale(2) translateY(-200px); }
}

/* GIFTS DISPLAY */
.gifts-container { position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); pointer-events: none; z-index: 16; }
.gift-popup { background: rgba(0,0,0,0.85); backdrop-filter: blur(20px); padding: 16px 24px; border-radius: 16px; display: flex; align-items: center; gap: 12px; animation: giftPop 3s ease-out forwards; border: 2px solid #ff0000; box-shadow: 0 0 30px rgba(255,0,0,0.5); }
@keyframes giftPop {
    0% { opacity: 0; transform: scale(0) translateY(50px); }
    20% { opacity: 1; transform: scale(1) translateY(0); }
    80% { opacity: 1; transform: scale(1) translateY(0); }
    100% { opacity: 0; transform: scale(0.8) translateY(-30px); }
}
.gift-emoji { font-size: 40px; }
.gift-info { font-size: 14px; font-weight: 600; }
.gift-sender { color: #ff0000; font-weight: 800; }

/* INTERACTION BAR */
.interaction-bar { background: rgba(20,20,20,0.5); border-radius: 12px; padding: 14px; margin-bottom: 16px; border: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: space-around; gap: 8px; flex-wrap: wrap; }
.interact-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 10px 16px; border-radius: 24px; cursor: pointer; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; transition: all 0.2s; }
.interact-btn:hover { background: rgba(255,255,255,0.1); transform: translateY(-2px); }
.interact-btn.like-btn { background: linear-gradient(135deg, #ff0000, #cc0000); border-color: transparent; box-shadow: 0 4px 12px rgba(255,0,0,0.3); }
.interact-btn.like-btn:active { transform: scale(0.9); }
.like-icon { font-size: 18px; }
.likes-display { font-weight: 700; }

/* QUICK REACTIONS */
.reaction-row { display: flex; gap: 6px; flex-wrap: wrap; }
.reaction-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 8px 12px; border-radius: 20px; cursor: pointer; font-size: 18px; transition: all 0.2s; }
.reaction-btn:hover { background: rgba(255,255,255,0.15); transform: scale(1.2); }
.reaction-btn:active { transform: scale(0.9); }

/* GIFTS PANEL */
.gifts-btn-bar { background: rgba(20,20,20,0.5); border-radius: 12px; padding: 12px; margin-bottom: 16px; border: 1px solid rgba(255,255,255,0.08); }
.gifts-title { font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.6); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; text-align: center; }
.gifts-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.gift-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 10px 14px; border-radius: 14px; cursor: pointer; font-size: 24px; transition: all 0.2s; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 60px; }
.gift-btn:hover { background: rgba(255,255,255,0.15); transform: translateY(-3px); border-color: #ff0000; }
.gift-btn:active { transform: scale(0.9); }
.gift-name { font-size: 9px; font-weight: 600; color: rgba(255,255,255,0.7); }

.stream-info-card { background: rgba(20,20,20,0.5); border-radius: 12px; padding: 20px; border: 1px solid rgba(255,255,255,0.08); }
.stream-title-text { font-size: 18px; font-weight: 700; margin-bottom: 12px; }
.streamer-info { display: flex; align-items: center; gap: 12px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.06); }
.streamer-avatar-lg { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #ff0000, #cc0000); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px; overflow: hidden; }
.streamer-avatar-lg img { width: 100%; height: 100%; object-fit: cover; }

.chat-card { background: rgba(20,20,20,0.5); border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; height: 600px; }
@media (max-width: 1024px) { .chat-card { height: 400px; } }
.chat-header { padding: 14px 16px; background: rgba(255,255,255,0.03); font-weight: 700; font-size: 14px; }
.chat-messages { flex: 1; overflow-y: auto; padding: 12px 16px; }
.chat-message { margin-bottom: 10px; display: flex; gap: 8px; }
.chat-avatar { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, #4285f4, #34a853); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0; overflow: hidden; }
.chat-avatar img { width: 100%; height: 100%; object-fit: cover; }
.chat-name { font-weight: 500; color: #4285f4; font-size: 13px; margin-right: 6px; }
.chat-text { font-size: 14px; }
.chat-time { font-size: 11px; color: #aaa; margin-top: 2px; }
.chat-input-wrap { display: flex; padding: 12px; gap: 8px; background: rgba(255,255,255,0.03); align-items: center; position: relative; }
.emoji-toggle { background: transparent; border: none; color: white; font-size: 22px; cursor: pointer; padding: 4px; }
.chat-input-wrap input { flex: 1; padding: 10px 14px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; color: white; font-size: 14px; outline: none; }
.chat-input-wrap button { background: #ff0000; color: white; border: none; padding: 8px 20px; border-radius: 20px; cursor: pointer; font-weight: 500; }

/* EMOJI PICKER */
.chat-emoji-picker { position: absolute; bottom: 60px; left: 10px; background: #1a1a1a; border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; padding: 12px; display: none; grid-template-columns: repeat(8, 1fr); gap: 4px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 100; }
.chat-emoji-picker.show { display: grid; }
.chat-emoji-picker .emoji-item { padding: 6px; cursor: pointer; border-radius: 8px; font-size: 20px; text-align: center; transition: all 0.15s; }
.chat-emoji-picker .emoji-item:hover { background: rgba(255,255,255,0.1); transform: scale(1.3); }

.loading { text-align: center; padding: 80px 20px; display: none; }
.spinner { width: 60px; height: 60px; border: 4px solid #303030; border-top: 4px solid #ff0000; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
@keyframes spin { to { transform: rotate(360deg); } }
.stream-ended { text-align: center; padding: 80px 20px; display: none; }
.stream-ended .emoji { font-size: 100px; margin-bottom: 20px; opacity: 0.5; }
.stream-ended h2 { margin-bottom: 12px; font-size: 28px; }
.stream-ended p { color: #aaa; margin-bottom: 24px; }

@media (max-width: 768px) {
.logo-text { display: none; }
.container { padding: 16px; }
.interact-btn { font-size: 13px; padding: 8px 12px; }
.gift-btn { min-width: 50px; padding: 8px 10px; font-size: 22px; }
}
</style>
</head>

<script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
const savedName = localStorage.getItem('f12_username');
const userPhoto = localStorage.getItem('f12_photo');
if (savedName) document.getElementById('viewer-name').value = savedName;
const socket = io();
let peer = null, viewerName = '';
let totalLikes = 0;
let userLikes = 0;
const pathParts = window.location.pathname.split('/');
const streamId = pathParts[pathParts.length - 1];

function joinStream() {
    viewerName = document.getElementById('viewer-name').value.trim();
    if (!viewerName) { alert('Please enter your name!'); return; }
    document.getElementById('name-section').style.display = 'none';
    document.getElementById('loading').style.display = 'block';
    peer = new Peer({ config: { 'iceServers': [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
    ]}});
    peer.on('open', () => { socket.emit('join-stream', { streamId: streamId, viewerName: viewerName }); });
    peer.on('error', (err) => console.error(err));
}

socket.on('streamer-info', (data) => {
    document.getElementById('stream-title').textContent = data.title;
    document.getElementById('streamer-name').textContent = data.streamerName;
    document.getElementById('stream-meta').textContent = (data.category || 'Live') + ' on F12 ORBIT';
    totalLikes = data.likes || 0;
    document.getElementById('likes-count').textContent = totalLikes;
    document.getElementById('like-btn-count').textContent = totalLikes;
    const sAvatar = document.getElementById('streamer-avatar');
    if (data.streamerPhoto) sAvatar.innerHTML = '<img src="' + data.streamerPhoto + '">';
    else sAvatar.textContent = data.streamerName.charAt(0).toUpperCase();
    const call = peer.call(data.peerId, createEmptyStream());
    call.on('stream', (remoteStream) => {
        const video = document.getElementById('remote-video');
        video.srcObject = remoteStream;
        video.volume = 1.0;
        video.muted = false;
        video.play().then(() => {}).catch(() => {
            video.muted = true;
            document.getElementById('unmute-overlay').classList.add('show');
            video.play();
        });
        document.getElementById('loading').style.display = 'none';
        document.getElementById('watch-section').style.display = 'block';
        document.getElementById('chat-area').style.display = 'flex';
    });
});

function enableAudio() {
    const video = document.getElementById('remote-video');
    video.muted = false;
    video.volume = 1.0;
    document.getElementById('unmute-overlay').classList.remove('show');
}

function createEmptyStream() {
    const canvas = document.createElement('canvas');
    canvas.width = 1; canvas.height = 1;
    canvas.getContext('2d').fillRect(0, 0, 1, 1);
    return canvas.captureStream();
}

function toggleMute() {
    const video = document.getElementById('remote-video');
    const btn = document.getElementById('volume-btn');
    video.muted = !video.muted;
    btn.textContent = video.muted ? '🔇' : '🔊';
}

function changeVolume(value) {
    const video = document.getElementById('remote-video');
    video.muted = false;
    video.volume = value / 100;
    document.getElementById('volume-btn').textContent = value == 0 ? '🔇' : value < 50 ? '🔉' : '🔊';
}

socket.on('viewer-count', (data) => {
    const el = document.getElementById('viewer-count');
    if (el) el.textContent = data.count;
});

socket.on('stream-error', (data) => {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('name-section').style.display = 'none';
    document.getElementById('stream-ended').style.display = 'block';
    document.querySelector('.stream-ended h2').textContent = data.message;
});

socket.on('stream-ended', () => {
    document.getElementById('watch-section').style.display = 'none';
    document.getElementById('loading').style.display = 'none';
    document.getElementById('chat-area').style.display = 'none';
    document.getElementById('stream-ended').style.display = 'block';
    const video = document.getElementById('remote-video');
    if (video.srcObject) video.srcObject.getTracks().forEach(track => track.stop());
    if (peer) peer.destroy();
});

// LIKE SYSTEM
function sendLike() {
    socket.emit('like-stream', { streamId: streamId, fromName: viewerName });
    createFloatingHeart();
}

socket.on('stream-liked', (data) => {
    totalLikes = data.likes;
    document.getElementById('likes-count').textContent = totalLikes;
    document.getElementById('like-btn-count').textContent = totalLikes;
    createFloatingHeart();
});

function createFloatingHeart() {
    const container = document.getElementById('hearts-container');
    const heart = document.createElement('div');
    heart.className = 'floating-heart';
    const hearts = ['❤️', '💖', '💕', '💗', '💝', '💘'];
    heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
    const leftPos = Math.random() * 40;
    heart.style.left = leftPos + 'px';
    const xDrift = (Math.random() - 0.5) * 60;
    heart.style.setProperty('--x-drift', xDrift + 'px');
    const rotate = (Math.random() - 0.5) * 60;
    heart.style.setProperty('--rotate', rotate + 'deg');
    container.appendChild(heart);
    setTimeout(() => heart.remove(), 3000);
}

// REACTIONS
function sendReaction(emoji) {
    socket.emit('send-reaction', { streamId: streamId, emoji: emoji, fromName: viewerName });
}

socket.on('new-reaction', (data) => {
    const container = document.getElementById('reactions-container');
    const reaction = document.createElement('div');
    reaction.className = 'floating-reaction';
    reaction.textContent = data.emoji;
    const leftPos = Math.random() * 200;
    reaction.style.left = leftPos + 'px';
    container.appendChild(reaction);
    setTimeout(() => reaction.remove(), 2500);
});

// GIFTS
function sendGift(emoji, name) {
    socket.emit('send-gift', { streamId: streamId, gift: { emoji: emoji, name: name }, fromName: viewerName });
}

socket.on('new-gift', (data) => {
    const container = document.getElementById('gifts-container');
    const giftEl = document.createElement('div');
    giftEl.className = 'gift-popup';
    giftEl.innerHTML = '<div class="gift-emoji">' + data.gift.emoji + '</div>' +
        '<div class="gift-info"><span class="gift-sender">' + data.fromName + '</span> sent a ' + data.gift.name + '!</div>';
    container.appendChild(giftEl);
    setTimeout(() => giftEl.remove(), 3000);
});

socket.on('new-message', (data) => {
    const chatMessages = document.getElementById('chat-messages');
    const msgDiv = document.createElement('div');
    msgDiv.className = 'chat-message';
    const avatar = data.photo ? '<img src="' + data.photo + '">' : data.name.charAt(0).toUpperCase();
    msgDiv.innerHTML = '<div class="chat-avatar">' + avatar + '</div><div><span class="chat-name">' + data.name + '</span><span class="chat-text">' + data.message + '</span><div class="chat-time">' + data.time + '</div></div>';
    chatMessages.appendChild(msgDiv);
    chatMessages.scrollTop = chatMessages.scrollHeight;
});

function sendChat() {
    const input = document.getElementById('chat-input');
    const message = input.value.trim();
    if (message && streamId) {
        socket.emit('chat-message', { streamId: streamId, name: viewerName, photo: userPhoto, message: message });
        input.value = '';
    }
}

function toggleChatEmoji() {
    document.getElementById('chat-emoji-picker').classList.toggle('show');
}

function insertChatEmoji(emoji) {
    document.getElementById('chat-input').value += emoji;
    document.getElementById('chat-input').focus();
}

document.addEventListener('click', (e) => {
    if (!e.target.closest('.chat-emoji-picker') && !e.target.closest('.emoji-toggle')) {
        document.getElementById('chat-emoji-picker').classList.remove('show');
    }
});
</script>
</body>
</html>
