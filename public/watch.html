<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch Live - F12 ORBIT</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', sans-serif; }
body { background: #0f0f0f; color: #fff; min-height: 100vh; }
.header { background: #0f0f0f; padding: 0 24px; height: 60px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #272727; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: white; }
.logo-icon { width: 36px; height: 36px; background: linear-gradient(135deg, #ff0000, #cc0000); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; color: white; }
.logo-text { font-size: 22px; font-weight: 900; letter-spacing: -1px; }
.logo-text span { color: #ff0000; }
.back-btn { background: transparent; color: #fff; border: 1px solid #303030; padding: 8px 16px; border-radius: 20px; text-decoration: none; font-size: 14px; }
.container { max-width: 1400px; margin: 0 auto; padding: 24px; display: grid; grid-template-columns: 1fr 380px; gap: 20px; }
@media (max-width: 1024px) { .container { grid-template-columns: 1fr; } }
.name-section { background: #1f1f1f; border-radius: 16px; padding: 40px; text-align: center; border: 1px solid #303030; }
.name-section h2 { font-size: 24px; margin-bottom: 8px; }
.name-section p { color: #aaa; margin-bottom: 24px; font-size: 14px; }
.name-section input { padding: 14px 18px; background: #0f0f0f; border: 1px solid #303030; border-radius: 8px; color: #fff; font-size: 15px; outline: none; width: 100%; max-width: 350px; margin-bottom: 16px; }
.join-btn { background: linear-gradient(135deg, #ff0000, #cc0000); color: white; border: none; padding: 14px 32px; border-radius: 25px; font-size: 15px; cursor: pointer; font-weight: 700; }
.watch-section { display: none; }
.video-wrapper { position: relative; width: 100%; background: #000; border-radius: 12px; overflow: hidden; margin-bottom: 16px; }
.video-wrapper video { width: 100%; height: auto; max-height: 600px; display: block; }
.live-overlay { position: absolute; top: 16px; left: 16px; display: flex; gap: 10px; z-index: 10; }
.live-badge { background: #ff0000; padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.live-badge .dot { width: 8px; height: 8px; background: white; border-radius: 50%; animation: pulse 1s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
.viewer-badge { background: rgba(0,0,0,0.85); padding: 6px 14px; border-radius: 6px; font-size: 13px; }
.volume-control { position: absolute; bottom: 16px; right: 16px; background: rgba(0,0,0,0.85); padding: 8px 14px; border-radius: 20px; display: flex; align-items: center; gap: 10px; z-index: 10; }
.volume-btn { background: transparent; border: none; color: white; font-size: 18px; cursor: pointer; }
.volume-slider { width: 80px; cursor: pointer; }
.stream-info-card { background: #1f1f1f; border-radius: 12px; padding: 20px; border: 1px solid #303030; }
.stream-title-text { font-size: 18px; font-weight: 700; margin-bottom: 12px; }
.streamer-info { display: flex; align-items: center; gap: 12px; padding-top: 12px; border-top: 1px solid #303030; }
.streamer-avatar-lg { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #ff0000, #cc0000); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px; }
.chat-card { background: #1f1f1f; border-radius: 12px; overflow: hidden; border: 1px solid #303030; display: flex; flex-direction: column; height: 600px; }
@media (max-width: 1024px) { .chat-card { height: 400px; } }
.chat-header { padding: 14px 16px; background: #272727; font-weight: 700; font-size: 14px; }
.chat-messages { flex: 1; overflow-y: auto; padding: 12px 16px; }
.chat-message { margin-bottom: 10px; display: flex; gap: 8px; }
.chat-avatar { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, #4285f4, #34a853); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0; }
.chat-content { flex: 1; }
.chat-name { font-weight: 500; color: #4285f4; font-size: 13px; margin-right: 6px; }
.chat-text { font-size: 14px; }
.chat-time { font-size: 11px; color: #aaa; margin-top: 2px; }
.chat-input-wrap { display: flex; padding: 12px; gap: 8px; background: #272727; }
.chat-input-wrap input { flex: 1; padding: 10px 14px; background: #0f0f0f; border: 1px solid #303030; border-radius: 20px; color: white; font-size: 14px; outline: none; }
.chat-input-wrap button { background: #ff0000; color: white; border: none; padding: 8px 20px; border-radius: 20px; cursor: pointer; font-weight: 500; }
.loading { text-align: center; padding: 80px 20px; display: none; }
.spinner { width: 60px; height: 60px; border: 4px solid #303030; border-top: 4px solid #ff0000; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
@keyframes spin { to { transform: rotate(360deg); } }
.stream-ended { text-align: center; padding: 80px 20px; display: none; }
.stream-ended .emoji { font-size: 100px; margin-bottom: 20px; opacity: 0.5; }
.stream-ended h2 { margin-bottom: 12px; font-size: 28px; }
.stream-ended p { color: #aaa; margin-bottom: 24px; }
</style>
</head>
<body>
<div class="header">
<a href="/" class="logo">
<div class="logo-icon">F12</div>
<div class="logo-text">F12 <span>ORBIT</span></div>
</a>
<a href="/" class="back-btn">← Home</a>
</div>
<div class="container">
<div>
<div id="name-section" class="name-section">
<h2>👋 Welcome to F12 ORBIT!</h2>
<p>Enter your name to join the live stream</p>
<input type="text" id="viewer-name" placeholder="Your name..." maxlength="20">
<br>
<button class="join-btn" onclick="joinStream()">▶️ Watch Stream</button>
</div>
<div id="loading" class="loading">
<div class="spinner"></div>
<p style="color: #aaa;">Connecting to stream...</p>
</div>
<div id="watch-section" class="watch-section">
<div class="video-wrapper">
<video id="remote-video" autoplay playsinline></video>
<div class="live-overlay">
<div class="live-badge"><div class="dot"></div>LIVE</div>
<div class="viewer-badge" id="viewer-count">👁 0</div>
</div>
<div class="volume-control">
<button class="volume-btn" id="volume-btn" onclick="toggleMute()">🔊</button>
<input type="range" class="volume-slider" id="volume-slider" min="0" max="100" value="100" onchange="changeVolume(this.value)">
</div>
</div>
<div class="stream-info-card">
<div class="stream-title-text">Live Stream</div>
<div class="streamer-info">
<div class="streamer-avatar-lg">S</div>
<div>
<div style="font-weight: 700;">Streamer</div>
<div style="font-size: 13px; color: #aaa; margin-top: 2px;">Live now on F12 ORBIT</div>
</div>
</div>
</div>
</div>
<div id="stream-ended" class="stream-ended">
<div class="emoji">📺</div>
<h2>Stream Ended</h2>
<p>This live stream is no longer available.</p>
<a href="/" class="join-btn" style="text-decoration: none;">🏠 Back to Home</a>
</div>
</div>
<div class="chat-card" id="chat-area" style="display:none;">
<div class="chat-header">💬 Live Chat</div>
<div id="chat-messages" class="chat-messages"></div>
<div class="chat-input-wrap">
<input type="text" id="chat-input" placeholder="Say something..." onkeypress="if(event.key==='Enter') sendChat()">
<button onclick="sendChat()">Send</button>
</div>
</div>
</div>
<script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
const savedName = localStorage.getItem('f12_username');
if (savedName) { document.getElementById('viewer-name').value = savedName; }
const socket = io();
let peer = null, viewerName = '';
const pathParts = window.location.pathname.split('/');
const streamId = pathParts[pathParts.length - 1];
function joinStream() {
viewerName = document.getElementById('viewer-name').value.trim();
if (!viewerName) { alert('Please enter your name!'); return; }
document.getElementById('name-section').style.display = 'none';
document.getElementById('loading').style.display = 'block';
peer = new Peer({ config: { 'iceServers': [
{ urls: 'stun:stun.l.google.com:19302' },
{ urls: 'stun:stun1.l.google.com:19302' },
{ urls: 'stun:stun2.l.google.com:19302' }
]}});
peer.on('open', () => { socket.emit('join-stream', { streamId: streamId, viewerName: viewerName }); });
peer.on('error', (err) => console.error('Peer error:', err));
}
socket.on('streamer-peer-id', (data) => {
const call = peer.call(data.peerId, createEmptyStream());
call.on('stream', (remoteStream) => {
const video = document.getElementById('remote-video');
video.srcObject = remoteStream;
video.muted = false;
video.volume = 1.0;
video.play().catch(() => {});
document.getElementById('loading').style.display = 'none';
document.getElementById('watch-section').style.display = 'block';
document.getElementById('chat-area').style.display = 'flex';
});
call.on('error', (err) => console.error('Call error:', err));
});
function createEmptyStream() {
const canvas = document.createElement('canvas');
canvas.width = 1; canvas.height = 1;
canvas.getContext('2d').fillRect(0, 0, 1, 1);
return canvas.captureStream();
}
function toggleMute() {
const video = document.getElementById('remote-video');
const btn = document.getElementById('volume-btn');
video.muted = !video.muted;
btn.textContent = video.muted ? '🔇' : '🔊';
}
function changeVolume(value) {
const video = document.getElementById('remote-video');
video.volume = value / 100;
document.getElementById('volume-btn').textContent = value == 0 ? '🔇' : value < 50 ? '🔉' : '🔊';
}
socket.on('viewer-count', (data) => {
const el = document.getElementById('viewer-count');
if (el) el.textContent = '👁 ' + data.count;
});
socket.on('stream-error', (data) => {
document.getElementById('loading').style.display = 'none';
document.getElementById('name-section').style.display = 'none';
document.getElementById('stream-ended').style.display = 'block';
document.querySelector('.stream-ended h2').textContent = data.message;
});
socket.on('stream-ended', () => {
document.getElementById('watch-section').style.display = 'none';
document.getElementById('loading').style.display = 'none';
document.getElementById('chat-area').style.display = 'none';
document.getElementById('stream-ended').style.display = 'block';
const video = document.getElementById('remote-video');
if (video.srcObject) video.srcObject.getTracks().forEach(track => track.stop());
if (peer) peer.destroy();
});
socket.on('new-message', (data) => {
const chatMessages = document.getElementById('chat-messages');
const msgDiv = document.createElement('div');
msgDiv.className = 'chat-message';
msgDiv.innerHTML = '<div class="chat-avatar">' + data.name.charAt(0).toUpperCase() + '</div><div class="chat-content"><span class="chat-name">' + data.name + '</span><span class="chat-text">' + data.message + '</span><div class="chat-time">' + data.time + '</div></div>';
chatMessages.appendChild(msgDiv);
chatMessages.scrollTop = chatMessages.scrollHeight;
});
function sendChat() {
const input = document.getElementById('chat-input');
const message = input.value.trim();
if (message && streamId) {
socket.emit('chat-message', { streamId: streamId, name: viewerName, message: message });
input.value = '';
}
}
</script>
</body>
</html>
