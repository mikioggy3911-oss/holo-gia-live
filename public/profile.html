<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile - F12 ORBIT</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
body { background: #0a0a0a; color: #fff; min-height: 100vh; }
.header { background: rgba(10,10,10,0.85); backdrop-filter: blur(20px); padding: 0 28px; height: 68px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.06); position: sticky; top: 0; z-index: 100; }
.logo { display: flex; align-items: center; gap: 12px; text-decoration: none; color: white; }
.f12-logo-wrapper { display: inline-block; padding: 2px; border-radius: 22px; background: linear-gradient(90deg, #ffffff 0%, #d0d0d0 40%, #a8a8a8 49%, #ff3333 51%, #cc0000 70%, #880000 100%); box-shadow: 0 0 20px rgba(255,0,0,0.3); }
.f12-logo-inner { display: inline-flex; align-items: center; padding: 7px 18px; background: #000; border-radius: 20px; position: relative; overflow: hidden; }
.f12-logo-inner::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 50%; background: linear-gradient(180deg, rgba(255,255,255,0.12), transparent); pointer-events: none; }
.f12-text-logo { font-family: 'Orbitron', sans-serif; font-size: 22px; font-weight: 900; letter-spacing: -2px; font-style: italic; line-height: 1; display: flex; position: relative; z-index: 2; }
.f12-text-logo .f { background: linear-gradient(180deg, #ffffff 0%, #e8e8e8 50%, #a8a8a8 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.8)); margin-right: 1px; }
.f12-text-logo .num { background: linear-gradient(180deg, #ff4444 0%, #cc0000 50%, #880000 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.8)); }
.logo-text { font-size: 16px; font-weight: 800; letter-spacing: -0.5px; }
.logo-text span { color: #ff0000; }
.back-btn { background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1); padding: 10px 18px; border-radius: 24px; text-decoration: none; font-size: 14px; font-weight: 600; }
.back-btn:hover { background: rgba(255,255,255,0.1); }
.container { max-width: 800px; margin: 0 auto; padding: 32px 24px; }
.cover-photo { width: 100%; height: 240px; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #ff0000 100%); border-radius: 20px 20px 0 0; position: relative; overflow: hidden; cursor: pointer; }
.cover-photo img { width: 100%; height: 100%; object-fit: cover; }
.cover-edit-btn { position: absolute; top: 16px; right: 16px; background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); color: white; border: none; padding: 10px 16px; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.cover-edit-btn:hover { background: rgba(0,0,0,0.9); }
@media (max-width: 600px) { .cover-photo { height: 160px; } }
.profile-card { background: rgba(20,20,20,0.5); backdrop-filter: blur(20px); border-radius: 0 0 20px 20px; padding: 20px 32px 32px; border: 1px solid rgba(255,255,255,0.08); border-top: none; position: relative; }
.profile-pic-wrapper { position: relative; margin-top: -80px; width: 160px; height: 160px; }
.profile-pic { width: 160px; height: 160px; border-radius: 50%; background: linear-gradient(135deg, #ff0000, #cc0000); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 60px; overflow: hidden; border: 5px solid #0a0a0a; box-shadow: 0 8px 30px rgba(0,0,0,0.5); }
.profile-pic img { width: 100%; height: 100%; object-fit: cover; }
.profile-pic-edit { position: absolute; bottom: 8px; right: 8px; background: #ff0000; color: white; width: 40px; height: 40px; border-radius: 50%; border: 3px solid #0a0a0a; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; transition: all 0.2s; }
.profile-pic-edit:hover { background: #cc0000; transform: scale(1.1); }
@media (max-width: 600px) { .profile-pic-wrapper, .profile-pic { width: 120px; height: 120px; } .profile-pic { font-size: 48px; margin-top: -60px; } }
.profile-info { margin-top: 20px; }
.profile-name { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 4px; }
.profile-email { color: rgba(255,255,255,0.5); font-size: 14px; font-weight: 500; }
.profile-bio { color: rgba(255,255,255,0.7); font-size: 15px; margin-top: 12px; line-height: 1.5; }
.profile-stats { display: flex; gap: 24px; margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.06); }
.stat-item { display: flex; flex-direction: column; }
.stat-value { font-size: 20px; font-weight: 800; }
.stat-label { font-size: 12px; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }
.status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; margin-top: 8px; }
.status-online { background: rgba(0,255,136,0.15); color: #00ff88; border: 1px solid rgba(0,255,136,0.3); }
.status-busy { background: rgba(255,193,7,0.15); color: #ffc107; border: 1px solid rgba(255,193,7,0.3); }
.status-away { background: rgba(108,117,125,0.15); color: #9ca3af; border: 1px solid rgba(108,117,125,0.3); }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.edit-section { background: rgba(20,20,20,0.5); backdrop-filter: blur(20px); border-radius: 20px; padding: 32px; margin-top: 20px; border: 1px solid rgba(255,255,255,0.08); }
.section-title { font-size: 20px; font-weight: 800; margin-bottom: 24px; letter-spacing: -0.3px; display: flex; align-items: center; gap: 10px; }
.section-icon { font-size: 24px; }
.form-group { margin-bottom: 20px; }
.form-group label { display: block; margin-bottom: 10px; font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.7); text-transform: uppercase; letter-spacing: 0.5px; }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 14px 18px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: #fff; font-size: 15px; outline: none; transition: all 0.2s; font-family: 'Inter', sans-serif; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #ff0000; background: rgba(255,255,255,0.08); }
.form-group textarea { resize: vertical; min-height: 100px; }
.char-count { font-size: 12px; color: rgba(255,255,255,0.4); text-align: right; margin-top: 4px; }
.status-options { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.status-option { padding: 14px; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); border-radius: 12px; cursor: pointer; text-align: center; transition: all 0.2s; }
.status-option:hover { background: rgba(255,255,255,0.08); }
.status-option.active { border-color: #ff0000; background: rgba(255,0,0,0.1); }
.status-option-icon { font-size: 24px; margin-bottom: 4px; }
.status-option-label { font-size: 13px; font-weight: 600; }
.btn-row { display: flex; gap: 12px; margin-top: 24px; }
.btn { padding: 14px 28px; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; border: none; transition: all 0.2s; flex: 1; }
.btn-primary { background: linear-gradient(135deg, #ff0000, #cc0000); color: white; box-shadow: 0 8px 24px rgba(255,0,0,0.3); }
.btn-primary:hover { transform: translateY(-2px); }
.btn-secondary { background: rgba(255,255,255,0.05); color: white; border: 1px solid rgba(255,255,255,0.1); }
.btn-secondary:hover { background: rgba(255,255,255,0.1); }
.btn-danger { background: rgba(255,0,0,0.1); color: #ff5252; border: 1px solid rgba(255,0,0,0.3); }
.btn-danger:hover { background: rgba(255,0,0,0.2); }
.success-msg { background: rgba(0,255,136,0.15); color: #00ff88; padding: 14px 20px; border-radius: 12px; margin-bottom: 20px; display: none; font-weight: 600; border: 1px solid rgba(0,255,136,0.3); }
.success-msg.show { display: block; animation: slideDown 0.3s; }
@keyframes slideDown { from { transform: translateY(-10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.hidden-input { display: none; }
.danger-zone { background: rgba(255,0,0,0.05); border: 1px solid rgba(255,0,0,0.2); border-radius: 16px; padding: 24px; margin-top: 20px; }
.danger-title { color: #ff5252; font-weight: 800; font-size: 16px; margin-bottom: 8px; }
.danger-text { color: rgba(255,255,255,0.6); font-size: 13px; margin-bottom: 16px; }
@media (max-width: 768px) {
.container { padding: 20px 16px; }
.profile-card { padding: 16px 20px 24px; }
.profile-name { font-size: 22px; }
.edit-section { padding: 20px; }
.status-options { grid-template-columns: 1fr; }
.btn-row { flex-direction: column; }
}
</style>
</head>
<body>

<div class="header">
<a href="/" class="logo">
<div class="f12-logo-wrapper">
<div class="f12-logo-inner">
<div class="f12-text-logo"><span class="f">F</span><span class="num">12</span></div>
</div>
</div>
<div class="logo-text">ORBIT</div>
</a>
<a href="/" class="back-btn">← Back</a>
</div>

<div class="container">

<div class="cover-photo" id="cover-photo">
<img id="cover-preview" style="display:none;" alt="Cover">
<button class="cover-edit-btn" onclick="document.getElementById('cover-input').click()">
📷 Edit Cover
</button>
<input type="file" id="cover-input" class="hidden-input" accept="image/*" onchange="handleCoverUpload(event)">
</div>

<div class="profile-card">

<div class="profile-pic-wrapper">
<div class="profile-pic" id="profile-pic">U</div>
<button class="profile-pic-edit" onclick="document.getElementById('photo-input').click()">📷</button>
<input type="file" id="photo-input" class="hidden-input" accept="image/*" onchange="handlePhotoUpload(event)">
</div>

<div class="profile-info">
<div class="profile-name" id="display-name">User Name</div>
<div class="profile-email" id="display-email"></div>
<div class="status-badge status-online" id="status-badge">
<div class="status-dot"></div>
<span id="status-text">Online</span>
</div>
<div class="profile-bio" id="display-bio"></div>

<div class="profile-stats">
<div class="stat-item">
<div class="stat-value" id="stat-friends">0</div>
<div class="stat-label">Friends</div>
</div>
<div class="stat-item">
<div class="stat-value" id="stat-streams">0</div>
<div class="stat-label">Streams</div>
</div>
<div class="stat-item">
<div class="stat-value" id="stat-views">0</div>
<div class="stat-label">Total Views</div>
</div>
</div>
</div>

</div>

<div class="success-msg" id="success-msg">
✅ Profile updated successfully!
</div>

<div class="edit-section">
<div class="section-title">
<span class="section-icon">✏️</span>
<span>Edit Profile</span>
</div>

<div class="form-group">
<label>Display Name</label>
<input type="text" id="edit-name" placeholder="Your name" maxlength="30">
</div>

<div class="form-group">
<label>Bio (About You)</label>
<textarea id="edit-bio" placeholder="Tell us about yourself..." maxlength="150"></textarea>
<div class="char-count"><span id="bio-count">0</span>/150</div>
</div>

<div class="form-group">
<label>Status</label>
<div class="status-options">
<div class="status-option active" data-status="online" onclick="selectStatus(this)">
<div class="status-option-icon">🟢</div>
<div class="status-option-label">Online</div>
</div>
<div class="status-option" data-status="busy" onclick="selectStatus(this)">
<div class="status-option-icon">🟡</div>
<div class="status-option-label">Busy</div>
</div>
<div class="status-option" data-status="away" onclick="selectStatus(this)">
<div class="status-option-icon">⚪</div>
<div class="status-option-label">Away</div>
</div>
</div>
</div>

<div class="btn-row">
<button class="btn btn-secondary" onclick="resetForm()">Cancel</button>
<button class="btn btn-primary" onclick="saveProfile()">💾 Save Changes</button>
</div>
</div>

<div class="edit-section">
<div class="section-title">
<span class="section-icon">⚙️</span>
<span>Account Info</span>
</div>

<div class="form-group">
<label>Account Type</label>
<input type="text" id="account-type" readonly>
</div>

<div class="form-group">
<label>User ID</label>
<input type="text" id="user-id" readonly>
</div>

<div class="form-group">
<label>Member Since</label>
<input type="text" id="member-since" readonly>
</div>
</div>

<div class="danger-zone">
<div class="danger-title">⚠️ Danger Zone</div>
<div class="danger-text">Sign out from F12 ORBIT. You can sign in again anytime.</div>
<button class="btn btn-danger" onclick="signOut()">🚪 Sign Out</button>
</div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const username = localStorage.getItem('f12_username');
const userPhoto = localStorage.getItem('f12_photo');
const userEmail = localStorage.getItem('f12_email');
const userBio = localStorage.getItem('f12_bio') || '';
const userStatus = localStorage.getItem('f12_status') || 'online';
const userCover = localStorage.getItem('f12_cover');

if (!username) {
    window.location.href = '/login';
}

if (!localStorage.getItem('f12_member_since')) {
    localStorage.setItem('f12_member_since', new Date().toISOString());
}
const memberSince = localStorage.getItem('f12_member_since');

const socket = io();
let selectedStatus = userStatus;
let newPhotoBase64 = null;
let newCoverBase64 = null;

socket.on('connect', () => {
    socket.emit('user-online', {
        name: username,
        avatar: username.charAt(0).toUpperCase(),
        photo: userPhoto,
        bio: userBio,
        status: userStatus
    });
});

function loadProfile() {
    const picEl = document.getElementById('profile-pic');
    if (userPhoto) {
        picEl.innerHTML = '<img src="' + userPhoto + '" alt="' + username + '">';
    } else {
        picEl.textContent = username.charAt(0).toUpperCase();
    }
    
    if (userCover) {
        const coverEl = document.getElementById('cover-preview');
        coverEl.src = userCover;
        coverEl.style.display = 'block';
    }
    
    document.getElementById('display-name').textContent = username;
    document.getElementById('display-email').textContent = userEmail || 'Guest User';
    document.getElementById('display-bio').textContent = userBio || 'No bio yet. Click edit to add one!';
    
    updateStatusBadge(userStatus);
    
    document.getElementById('edit-name').value = username;
    document.getElementById('edit-bio').value = userBio;
    document.getElementById('bio-count').textContent = userBio.length;
    
    document.querySelectorAll('.status-option').forEach(opt => {
        opt.classList.toggle('active', opt.dataset.status === userStatus);
    });
    
    document.getElementById('account-type').value = userEmail ? '🔵 Google Account' : '👤 Guest Account';
    document.getElementById('user-id').value = 'F12-' + (userEmail || username).substring(0, 8).toUpperCase();
    
    const date = new Date(memberSince);
    document.getElementById('member-since').value = date.toLocaleDateString('en-US', { 
        year: 'numeric', month: 'long', day: 'numeric' 
    });
    
    loadStats();
}

function loadStats() {
    const friends = JSON.parse(localStorage.getItem('f12_friends') || '[]');
    const streams = parseInt(localStorage.getItem('f12_stream_count') || '0');
    const views = parseInt(localStorage.getItem('f12_total_views') || '0');
    
    document.getElementById('stat-friends').textContent = friends.length;
    document.getElementById('stat-streams').textContent = streams;
    document.getElementById('stat-views').textContent = views;
}

function updateStatusBadge(status) {
    const badge = document.getElementById('status-badge');
    const text = document.getElementById('status-text');
    
    badge.classList.remove('status-online', 'status-busy', 'status-away');
    
    if (status === 'online') {
        badge.classList.add('status-online');
        text.textContent = '🟢 Online';
    } else if (status === 'busy') {
        badge.classList.add('status-busy');
        text.textContent = '🟡 Busy';
    } else {
        badge.classList.add('status-away');
        text.textContent = '⚪ Away';
    }
}

function selectStatus(element) {
    document.querySelectorAll('.status-option').forEach(opt => opt.classList.remove('active'));
    element.classList.add('active');
    selectedStatus = element.dataset.status;
}

document.getElementById('edit-bio').addEventListener('input', (e) => {
    document.getElementById('bio-count').textContent = e.target.value.length;
});

function handlePhotoUpload(event) {
    const file = event.target.files[0];
    if (!file) return;
    
    if (file.size > 5 * 1024 * 1024) {
        alert('⚠️ Image too large! Please use an image under 5MB.');
        return;
    }
    
    const reader = new FileReader();
    reader.onload = function(e) {
        newPhotoBase64 = e.target.result;
        document.getElementById('profile-pic').innerHTML = '<img src="' + newPhotoBase64 + '" alt="Preview">';
    };
    reader.readAsDataURL(file);
}

function handleCoverUpload(event) {
    const file = event.target.files[0];
    if (!file) return;
    
    if (file.size > 5 * 1024 * 1024) {
        alert('⚠️ Image too large! Please use an image under 5MB.');
        return;
    }
    
    const reader = new FileReader();
    reader.onload = function(e) {
        newCoverBase64 = e.target.result;
        const coverEl = document.getElementById('cover-preview');
        coverEl.src = newCoverBase64;
        coverEl.style.display = 'block';
    };
    reader.readAsDataURL(file);
}

function saveProfile() {
    const newName = document.getElementById('edit-name').value.trim();
    const newBio = document.getElementById('edit-bio').value.trim();
    
    if (!newName) {
        alert('⚠️ Name cannot be empty!');
        return;
    }
    
    if (newName.length < 2) {
        alert('⚠️ Name must be at least 2 characters!');
        return;
    }
    
    localStorage.setItem('f12_username', newName);
    localStorage.setItem('f12_bio', newBio);
    localStorage.setItem('f12_status', selectedStatus);
    localStorage.setItem('f12_avatar', newName.charAt(0).toUpperCase());
    
    if (newPhotoBase64) {
        localStorage.setItem('f12_photo', newPhotoBase64);
    }
    
    if (newCoverBase64) {
        localStorage.setItem('f12_cover', newCoverBase64);
    }
    
    document.getElementById('display-name').textContent = newName;
    document.getElementById('display-bio').textContent = newBio || 'No bio yet.';
    updateStatusBadge(selectedStatus);
    
    socket.emit('update-profile', {
        name: newName,
        photo: newPhotoBase64 || userPhoto,
        bio: newBio,
        status: selectedStatus
    });
    
    const successMsg = document.getElementById('success-msg');
    successMsg.classList.add('show');
    setTimeout(() => successMsg.classList.remove('show'), 3000);
    
    setTimeout(() => {
        window.location.reload();
    }, 1500);
}

function resetForm() {
    if (confirm('Discard changes?')) {
        window.location.reload();
    }
}

function signOut() {
    if (confirm('Are you sure you want to sign out?')) {
        localStorage.clear();
        window.location.href = '/login';
    }
}

loadProfile();
</script>

</body>
</html>
