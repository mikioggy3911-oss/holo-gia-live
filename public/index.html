<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F12 ORBIT - Live Stream and Messaging</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', sans-serif; }
body { background: #0f0f0f; color: #fff; min-height: 100vh; overflow-x: hidden; }
.header { background: #0f0f0f; padding: 0 24px; height: 60px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #272727; }
.logo { display: flex; align-items: center; gap: 12px; cursor: pointer; text-decoration: none; color: white; }
.f12-logo-small { display: flex; align-items: center; justify-content: center; padding: 6px 14px; background: #000; border: 2px solid; border-image: linear-gradient(135deg, #fff 0%, #fff 50%, #ff0000 50%, #ff0000 100%) 1; border-radius: 12px; box-shadow: 0 0 15px rgba(255,0,0,0.3); }
.f12-text-small { font-size: 20px; font-weight: 900; letter-spacing: -1px; font-style: italic; line-height: 1; }
.f12-text-small .f { color: #fff; }
.f12-text-small .num { color: #ff0000; }
.logo-text { font-size: 18px; font-weight: 900; letter-spacing: -1px; }
.logo-text span { color: #ff0000; }
.nav-tabs { display: flex; gap: 8px; margin-left: 30px; }
.nav-tab { background: transparent; color: #aaa; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 14px; font-weight: 500; text-decoration: none; }
.nav-tab.active { background: #ff0000; color: white; }
.nav-tab:hover:not(.active) { background: #272727; color: white; }
.header-right { display: flex; align-items: center; gap: 12px; }
.go-live-btn { background: #ff0000; color: white; border: none; padding: 9px 18px; border-radius: 20px; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; text-decoration: none; }
.go-live-btn:hover { background: #cc0000; }
.live-dot { width: 8px; height: 8px; background: white; border-radius: 50%; animation: pulse 1.5s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
.notif-btn { background: transparent; border: none; color: white; cursor: pointer; padding: 8px; border-radius: 50%; position: relative; transition: background 0.2s; font-size: 22px; }
.notif-btn:hover { background: #272727; }
.notif-badge { position: absolute; top: 4px; right: 4px; background: #ff0000; color: white; min-width: 18px; height: 18px; border-radius: 9px; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 5px; box-shadow: 0 0 0 2px #0f0f0f; }
.notif-badge.hidden { display: none; }
.user-info { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 4px 8px; border-radius: 20px; }
.user-info:hover { background: #272727; }
.user-avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #4285f4, #34a853); display: flex; align-items: center; justify-content: center; font-weight: 700; }
.user-name { font-size: 14px; font-weight: 500; }
.categories-bar { background: #0f0f0f; padding: 12px 24px; display: flex; gap: 12px; overflow-x: auto; border-bottom: 1px solid #272727; }
.categories-bar::-webkit-scrollbar { display: none; }
.category-chip { background: #272727; color: #fff; padding: 8px 16px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap; border: none; }
.category-chip:hover { background: #404040; }
.category-chip.active { background: #fff; color: #0f0f0f; }
.main-layout { display: grid; grid-template-columns: 1fr 360px; gap: 20px; max-width: 1800px; margin: 0 auto; padding: 24px; }
@media (max-width: 1024px) { .main-layout { grid-template-columns: 1fr; } .chat-sidebar { display: none; } }
.section-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
.live-indicator { background: #ff0000; color: white; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.live-indicator .dot { width: 6px; height: 6px; background: white; border-radius: 50%; animation: pulse 1s infinite; }
.streams-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.stream-card { cursor: pointer; transition: transform 0.2s; }
.stream-card:hover { transform: translateY(-2px); }
.stream-thumbnail { width: 100%; aspect-ratio: 16/9; background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460); border-radius: 12px; overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center; }
.play-overlay { font-size: 50px; opacity: 0.3; }
.live-badge { position: absolute; top: 8px; left: 8px; background: #ff0000; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; display: flex; align-items: center; gap: 5px; }
.live-badge .dot { width: 5px; height: 5px; background: white; border-radius: 50%; animation: pulse 1s infinite; }
.viewer-count { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.8); padding: 3px 8px; border-radius: 4px; font-size: 12px; }
.stream-info { display: flex; gap: 12px; margin-top: 12px; }
.streamer-avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #ff0000, #cc0000); display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; }
.stream-meta { flex: 1; min-width: 0; }
.stream-title { font-size: 14px; font-weight: 500; margin-bottom: 4px; line-height: 1.3; }
.streamer-name { font-size: 13px; color: #aaa; }
.stream-stats { font-size: 12px; color: #aaa; }
.no-streams { text-align: center; padding: 60px 20px; }
.no-streams .emoji { font-size: 80px; margin-bottom: 20px; opacity: 0.5; }
.no-streams h2 { font-size: 24px; margin-bottom: 12px; }
.no-streams p { color: #aaa; margin-bottom: 24px; }
.start-streaming-btn { background: #ff0000; color: white; border: none; padding: 12px 24px; border-radius: 25px; font-size: 16px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }

/* CHAT SIDEBAR - WhatsApp Style */
.chat-sidebar { background: #1f1f1f; border-radius: 12px; border: 1px solid #303030; height: calc(100vh - 180px); display: flex; flex-direction: column; position: sticky; top: 140px; overflow: hidden; }
.chat-sidebar-header { padding: 16px; background: #272727; border-bottom: 1px solid #303030; display: flex; align-items: center; justify-content: space-between; }
.chat-sidebar-title { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.online-dot-green { width: 8px; height: 8px; background: #00ff00; border-radius: 50%; box-shadow: 0 0 10px #00ff00; }
.online-count-badge { background: #ff0000; padding: 2px 10px; border-radius: 10px; font-size: 12px; font-weight: 700; }
.chat-sidebar-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

/* User list view */
.user-list-view { flex: 1; overflow-y: auto; }
.user-list-view::-webkit-scrollbar { width: 6px; }
.user-list-view::-webkit-scrollbar-thumb { background: #404040; border-radius: 3px; }
.search-box { padding: 12px; }
.search-box input { width: 100%; padding: 10px 14px; background: #0f0f0f; border: 1px solid #303030; border-radius: 20px; color: white; font-size: 13px; outline: none; }
.search-box input:focus { border-color: #ff0000; }
.user-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; border-bottom: 1px solid #272727; transition: background 0.2s; }
.user-item:hover { background: #272727; }
.user-item-avatar { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, #4285f4, #34a853); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; position: relative; flex-shrink: 0; }
.user-item-avatar::after { content: ''; position: absolute; bottom: 0; right: 0; width: 12px; height: 12px; background: #00ff00; border-radius: 50%; border: 2px solid #1f1f1f; }
.user-item-info { flex: 1; min-width: 0; }
.user-item-name { font-size: 14px; font-weight: 500; }
.user-item-last { font-size: 12px; color: #aaa; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.user-item-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.user-item-time { font-size: 11px; color: #aaa; }
.user-item-unread { background: #ff0000; color: white; min-width: 18px; height: 18px; border-radius: 9px; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 5px; }

/* Chat view (open chat) */
.chat-view { flex: 1; display: none; flex-direction: column; overflow: hidden; }
.chat-view.active { display: flex; }
.chat-view-header { padding: 12px 16px; background: #272727; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #303030; }
.chat-back { background: transparent; border: none; color: white; cursor: pointer; font-size: 20px; padding: 4px; }
.chat-header-avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #4285f4, #34a853); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; }
.chat-header-info { flex: 1; }
.chat-header-name { font-size: 14px; font-weight: 700; }
.chat-header-status { font-size: 11px; color: #00ff00; }
.chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: #0f0f0f; }
.chat-messages::-webkit-scrollbar { width: 6px; }
.chat-messages::-webkit-scrollbar-thumb { background: #404040; border-radius: 3px; }
.msg-bubble { max-width: 75%; padding: 8px 12px; border-radius: 14px; word-wrap: break-word; font-size: 14px; line-height: 1.4; }
.msg-bubble.sent { background: linear-gradient(135deg, #ff0000, #cc0000); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
.msg-bubble.received { background: #272727; color: white; align-self: flex-start; border-bottom-left-radius: 4px; }
.msg-time { font-size: 10px; opacity: 0.7; margin-top: 4px; }
.typing-ind { padding: 8px 14px; color: #aaa; font-size: 12px; font-style: italic; display: none; background: #0f0f0f; }
.typing-ind.show { display: block; }
.chat-input-area { display: flex; padding: 12px; gap: 8px; background: #272727; }
.chat-input-area input { flex: 1; padding: 10px 14px; background: #0f0f0f; border: 1px solid #303030; border-radius: 20px; color: white; font-size: 13px; outline: none; }
.chat-input-area input:focus { border-color: #ff0000; }
.chat-send-btn { background: #ff0000; color: white; border: none; padding: 0 20px; border-radius: 20px; cursor: pointer; font-weight: 700; }
.empty-msg { text-align: center; padding: 40px 20px; color: #666; }
.empty-msg .icon { font-size: 60px; opacity: 0.3; margin-bottom: 12px; }

/* Notification Dropdown */
.notif-dropdown { position: absolute; top: 60px; right: 80px; background: #1f1f1f; border: 1px solid #303030; border-radius: 12px; width: 360px; max-height: 500px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.5); display: none; z-index: 1000; }
.notif-dropdown.show { display: block; }
.notif-header { padding: 16px; border-bottom: 1px solid #303030; font-weight: 700; }
.notif-list { max-height: 400px; overflow-y: auto; }
.notif-item { padding: 12px 16px; border-bottom: 1px solid #272727; display: flex; gap: 12px; cursor: pointer; }
.notif-item:hover { background: #272727; }
.notif-avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #4285f4, #34a853); display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; }
.notif-content { flex: 1; }
.notif-name { font-weight: 700; font-size: 14px; }
.notif-text { font-size: 13px; color: #aaa; margin-top: 2px; }
.notif-time { font-size: 11px; color: #666; margin-top: 4px; }
.notif-empty { padding: 40px 20px; text-align: center; color: #666; }
.notif-empty .icon { font-size: 50px; opacity: 0.3; margin-bottom: 10px; }

@media (max-width: 768px) {
.header { padding: 0 12px; }
.nav-tabs { display: none; }
.user-name { display: none; }
.main-layout { padding: 16px; }
.streams-grid { grid-template-columns: 1fr; }
.notif-dropdown { width: 90vw; right: 5vw; }
}
</style>
</head>
<body>
<div class="header">
<a href="/" class="logo">
<div class="f12-logo-small">
<div class="f12-text-small"><span class="f">F</span><span class="num">12</span></div>
</div>
<div class="logo-text">ORBIT</div>
</a>
<div class="nav-tabs">
<a href="/" class="nav-tab active">Home</a>
</div>
<div class="header-right">
<a href="/go-live" class="go-live-btn">
<div class="live-dot"></div>Go Live
</a>
<button class="notif-btn" onclick="toggleNotif(event)">
🔔
<span class="notif-badge hidden" id="notif-badge">0</span>
</button>
<div class="user-info" onclick="window.location.href='/login'">
<div class="user-avatar" id="user-avatar">U</div>
<div class="user-name" id="user-name">User</div>
</div>
</div>
</div>

<div id="notif-dropdown" class="notif-dropdown">
<div class="notif-header">🔔 Notifications</div>
<div class="notif-list" id="notif-list">
<div class="notif-empty">
<div class="icon">🔕</div>
<div>No notifications yet</div>
</div>
</div>
</div>

<div class="categories-bar">
<button class="category-chip active">All</button>
<button class="category-chip">Gaming</button>
<button class="category-chip">Music</button>
<button class="category-chip">Chat</button>
<button class="category-chip">Education</button>
<button class="category-chip">News</button>
<button class="category-chip">Sports</button>
</div>

<div class="main-layout">
<div>
<div class="section-title">
<span class="live-indicator"><span class="dot"></span>LIVE NOW</span>
<span>Live Streams on F12 ORBIT</span>
</div>
<div id="streams-container" class="streams-grid"></div>
<div id="no-streams" class="no-streams" style="display: none;">
<div class="emoji">🪐</div>
<h2>No one is live right now</h2>
<p>Be the first to start streaming on F12 ORBIT!</p>
<a href="/go-live" class="start-streaming-btn">
<div class="live-dot"></div>Start Streaming Now
</a>
</div>
</div>

<div class="chat-sidebar">
<div class="chat-sidebar-header">
<div class="chat-sidebar-title">
<div class="online-dot-green"></div>
<span>💬 Messages</span>
</div>
<div class="online-count-badge" id="online-count">0</div>
</div>
<div class="chat-sidebar-content">

<div class="user-list-view" id="user-list-view">
<div class="search-box">
<input type="text" id="search-users" placeholder="🔍 Search users...">
</div>
<div id="users-list"></div>
</div>

<div class="chat-view" id="chat-view">
<div class="chat-view-header">
<button class="chat-back" onclick="closeChat()">←</button>
<div class="chat-header-avatar" id="chat-h-avatar">U</div>
<div class="chat-header-info">
<div class="chat-header-name" id="chat-h-name">User</div>
<div class="chat-header-status">● Online</div>
</div>
</div>
<div class="chat-messages" id="chat-messages-list"></div>
<div class="typing-ind" id="typing-ind"></div>
<div class="chat-input-area">
<input type="text" id="msg-input" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMsg()" oninput="handleTyping()">
<button class="chat-send-btn" onclick="sendMsg()">➤</button>
</div>
</div>

</div>
</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const username = localStorage.getItem('f12_username');
if (!username) { window.location.href = '/login'; }
document.getElementById('user-avatar').textContent = username.charAt(0).toUpperCase();
document.getElementById('user-name').textContent = username;

const socket = io();
let currentChatUser = null;
let typingTimeout = null;
const messageHistory = {};
const unreadCounts = {};
const notifications = [];

socket.on('connect', () => {
socket.emit('user-online', { name: username, avatar: username.charAt(0).toUpperCase() });
});

function formatViewers(count) {
if (count >= 1000) return (count/1000).toFixed(1) + 'K';
return count;
}

function getTimeAgo(date) {
const seconds = Math.floor((new Date() - new Date(date)) / 1000);
if (seconds < 60) return seconds + 's ago';
const minutes = Math.floor(seconds / 60);
if (minutes < 60) return minutes + 'm ago';
return Math.floor(minutes / 60) + 'h ago';
}

function loadStreams() {
fetch('/api/streams').then(res => res.json()).then(streams => {
const container = document.getElementById('streams-container');
const noStreams = document.getElementById('no-streams');
if (streams.length === 0) {
container.style.display = 'none';
noStreams.style.display = 'block';
} else {
container.style.display = 'grid';
noStreams.style.display = 'none';
container.innerHTML = streams.map(stream => '<div class="stream-card" onclick="window.location.href=\'/watch/' + stream.id + '\'"><div class="stream-thumbnail"><div class="live-badge"><div class="dot"></div>LIVE</div><span class="play-overlay">▶</span><div class="viewer-count">👁 ' + formatViewers(stream.viewers) + '</div></div><div class="stream-info"><div class="streamer-avatar">' + stream.streamerName.charAt(0).toUpperCase() + '</div><div class="stream-meta"><div class="stream-title">' + stream.title + '</div><div class="streamer-name">' + stream.streamerName + '</div><div class="stream-stats">' + formatViewers(stream.viewers) + ' watching • ' + getTimeAgo(stream.startedAt) + '</div></div></div></div>').join('');
}
});
}

function loadOnlineUsers() {
fetch('/api/online-users').then(res => res.json()).then(users => {
const list = document.getElementById('users-list');
const count = document.getElementById('online-count');
const others = users.filter(u => u.name !== username);
count.textContent = users.length;
if (others.length === 0) {
list.innerHTML = '<p style="color: #666; padding: 30px 20px; text-align: center; font-size: 13px;">No one online</p>';
} else {
list.innerHTML = others.map(user => {
const unread = unreadCounts[user.socketId] || 0;
const history = messageHistory[user.socketId];
const lastMsg = history && history.length > 0 ? history[history.length - 1] : null;
return '<div class="user-item" onclick="openChat(\'' + user.socketId + '\', \'' + user.name + '\', \'' + user.avatar + '\')"><div class="user-item-avatar">' + user.avatar + '</div><div class="user-item-info"><div class="user-item-name">' + user.name + '</div><div class="user-item-last">' + (lastMsg ? lastMsg.text : 'Click to chat') + '</div></div><div class="user-item-meta">' + (lastMsg ? '<div class="user-item-time">' + lastMsg.time + '</div>' : '') + (unread > 0 ? '<div class="user-item-unread">' + unread + '</div>' : '') + '</div></div>';
}).join('');
}
});
}

function openChat(socketId, name, avatar) {
currentChatUser = { id: socketId, name: name, avatar: avatar };
document.getElementById('user-list-view').style.display = 'none';
document.getElementById('chat-view').classList.add('active');
document.getElementById('chat-h-avatar').textContent = avatar;
document.getElementById('chat-h-name').textContent = name;
unreadCounts[socketId] = 0;
updateNotifBadge();
renderMessages(messageHistory[socketId] || []);
document.getElementById('msg-input').focus();
}

function closeChat() {
currentChatUser = null;
document.getElementById('user-list-view').style.display = 'block';
document.getElementById('chat-view').classList.remove('active');
loadOnlineUsers();
}

function renderMessages(messages) {
const container = document.getElementById('chat-messages-list');
container.innerHTML = messages.map(msg => '<div class="msg-bubble ' + msg.type + '">' + msg.text + '<div class="msg-time">' + msg.time + '</div></div>').join('');
container.scrollTop = container.scrollHeight;
}

function sendMsg() {
if (!currentChatUser) return;
const input = document.getElementById('msg-input');
const message = input.value.trim();
if (!message) return;
socket.emit('send-message', { toSocketId: currentChatUser.id, message: message });
input.value = '';
}

function handleTyping() {
if (!currentChatUser) return;
socket.emit('typing', { toSocketId: currentChatUser.id });
clearTimeout(typingTimeout);
typingTimeout = setTimeout(() => { socket.emit('stop-typing', { toSocketId: currentChatUser.id }); }, 1000);
}

socket.on('receive-message', (data) => {
if (!messageHistory[data.fromSocketId]) messageHistory[data.fromSocketId] = [];
messageHistory[data.fromSocketId].push({ type: 'received', text: data.message, time: data.time });

if (currentChatUser && currentChatUser.id === data.fromSocketId) {
renderMessages(messageHistory[data.fromSocketId]);
} else {
unreadCounts[data.fromSocketId] = (unreadCounts[data.fromSocketId] || 0) + 1;
addNotification(data.fromName, data.fromAvatar, data.message, data.fromSocketId);
playSound();
if (Notification.permission === 'granted') {
new Notification('💬 ' + data.fromName, { body: data.message });
}
loadOnlineUsers();
}
updateNotifBadge();
});

socket.on('message-sent', (data) => {
if (!messageHistory[data.toSocketId]) messageHistory[data.toSocketId] = [];
messageHistory[data.toSocketId].push({ type: 'sent', text: data.message, time: data.time });
if (currentChatUser && currentChatUser.id === data.toSocketId) {
renderMessages(messageHistory[data.toSocketId]);
}
});

socket.on('user-typing', (data) => {
if (currentChatUser && currentChatUser.id === data.fromSocketId) {
const ind = document.getElementById('typing-ind');
ind.textContent = data.fromName + ' is typing...';
ind.classList.add('show');
}
});

socket.on('user-stop-typing', (data) => {
if (currentChatUser && currentChatUser.id === data.fromSocketId) {
document.getElementById('typing-ind').classList.remove('show');
}
});

socket.on('message-error', (data) => {
alert('⚠️ ' + data.message);
});

function addNotification(name, avatar, message, socketId) {
notifications.unshift({
name: name,
avatar: avatar,
message: message,
socketId: socketId,
time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
});
if (notifications.length > 20) notifications.pop();
renderNotifications();
}

function renderNotifications() {
const list = document.getElementById('notif-list');
if (notifications.length === 0) {
list.innerHTML = '<div class="notif-empty"><div class="icon">🔕</div><div>No notifications yet</div></div>';
} else {
list.innerHTML = notifications.map(notif => '<div class="notif-item" onclick="openNotifChat(\'' + notif.socketId + '\', \'' + notif.name + '\', \'' + notif.avatar + '\')"><div class="notif-avatar">' + notif.avatar + '</div><div class="notif-content"><div class="notif-name">' + notif.name + '</div><div class="notif-text">' + notif.message + '</div><div class="notif-time">' + notif.time + '</div></div></div>').join('');
}
}

function openNotifChat(socketId, name, avatar) {
document.getElementById('notif-dropdown').classList.remove('show');
openChat(socketId, name, avatar);
}

function updateNotifBadge() {
const total = Object.values(unreadCounts).reduce((a, b) => a + b, 0);
const badge = document.getElementById('notif-badge');
if (total > 0) {
badge.textContent = total > 99 ? '99+' : total;
badge.classList.remove('hidden');
} else {
badge.classList.add('hidden');
}
}

function toggleNotif(event) {
event.stopPropagation();
document.getElementById('notif-dropdown').classList.toggle('show');
}

function playSound() {
try {
const audio = new Audio('data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQ==');
audio.volume = 0.3;
audio.play().catch(()=>{});
} catch(e) {}
}

document.addEventListener('click', (e) => {
const dropdown = document.getElementById('notif-dropdown');
if (!dropdown.contains(e.target) && !e.target.classList.contains('notif-btn')) {
dropdown.classList.remove('show');
}
});

document.getElementById('search-users').addEventListener('input', (e) => {
const search = e.target.value.toLowerCase();
document.querySelectorAll('.user-item').forEach(item => {
const name = item.querySelector('.user-item-name').textContent.toLowerCase();
item.style.display = name.includes(search) ? 'flex' : 'none';
});
});

if (Notification.permission === 'default') Notification.requestPermission();

loadStreams();
loadOnlineUsers();
socket.on('streams-updated', loadStreams);
socket.on('users-updated', loadOnlineUsers);
setInterval(loadStreams, 5000);
setInterval(loadOnlineUsers, 5000);

document.querySelectorAll('.category-chip').forEach(chip => {
chip.addEventListener('click', () => {
document.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
chip.classList.add('active');
});
});
</script>
</body>
</html>
